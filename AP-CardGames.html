/* plaque shape */
[data-theme="terminal"] .pshape { clip-path: polygon(0 0, 100% 0, 100% 64%, 88% 100%, 12% 100%, 0 64%); border-radius: 0; }
[data-theme="slot"] .pshape { border-radius: 10px; }
[data-theme="neon"] .pshape { border-radius: 12px; }
[data-theme="tropical"] .pshape { border-radius: 26px 26px 12px 12px; }
/* marquee bulbs: slot only */
.bulbs { display: none; }
[data-theme="slot"] .bulbs { display: flex; }
/* ambient effect: exactly one per theme */
.conf, .felt { display: none; }
[data-theme="slot"] .conf { display: block; }
[data-theme="tropical"] .felt { display: block; }
[data-theme="neon"] .wordmark { animation: dcFlicker 7s steps(1, end) infinite; }

/* ============================ base ============================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background-color: var(--bg);
  background-image: var(--bg-image);
  background-attachment: fixed;
  transition: background-color .24s ease, color .24s ease;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--acc1); }

.wrap { position: relative; max-width: 1240px; margin: 0 auto; padding: 22px 18px 40px; }
.skin { transition: background .24s ease, border-color .24s ease, color .24s ease, box-shadow .24s ease, border-radius .24s ease; }

/* ============================ header ============================ */
.head { position: relative; display: flex; align-items: center; justify-content: center; height: 84px; margin-bottom: 16px; }
.rule { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); animation: dcRule .7s cubic-bezier(.22,1,.36,1) .1s both; }
.plaque { position: relative; animation: dcPlaque .62s cubic-bezier(.34,1.56,.64,1) both; }
.pshape { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 320px; max-width: 74vw; height: 80px; padding: 0 22px;
  background: var(--plaque-bg); border: var(--plaque-border); box-shadow: var(--plaque-shadow); }
.wordmark { font-family: var(--word-family); font-size: var(--word-size); letter-spacing: var(--word-track);
  font-weight: var(--word-weight); text-shadow: var(--word-shadow); line-height: 1; color: var(--plaque-ink); white-space: nowrap; }
.plaque-sub { font-size: 9px; font-weight: 700; letter-spacing: .28em; color: var(--plaque-sub); text-transform: uppercase; margin-top: 5px; }
.opmark { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 7px;
  color: var(--mark-ink); font-family: var(--font-display); font-size: 13px; }
.backlink { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 7px;
  color: var(--mark-ink); font-size: 13px; font-weight: 600; text-decoration: none; padding: 8px 12px; border-radius: 999px;
  background: var(--rank-bg); }

/* ============================ live bar ============================ */
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 14px 14px 18px; margin-bottom: 16px;
  background: var(--strip-bg); border: var(--strip-border); border-radius: var(--strip-radius); box-shadow: var(--strip-shadow);
  color: var(--strip-ink); animation: dcBar .6s cubic-bezier(.34,1.56,.64,1) .18s both; }
.bar-icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: var(--strip-icon-bg);
  display: flex; align-items: center; justify-content: center; color: var(--strip-accent); }
.bar-id { display: flex; flex-direction: column; gap: 3px; min-width: 150px; }
.kicker { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: .2em;
  color: var(--live); text-transform: uppercase; }
.livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: dcDot 1.5s ease-in-out infinite; }
.bar-game { font-family: var(--font-display); font-size: 20px; color: var(--strip-ink); }
.bar-scores { flex: 1 1 260px; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.bar-score { display: flex; flex-direction: column; gap: 1px; padding: 0 13px; }
.bar-score + .bar-score { border-left: 1px solid var(--strip-hair); }
.bar-score b { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--strip-muted); }
.bar-score i { font-family: var(--font-display); font-style: normal; font-size: 21px; line-height: 1.1; color: var(--strip-ink); }
.bar-score.lead b, .bar-score.lead i { color: var(--strip-accent); }
.bar-score.lead i { animation: dcReel 5s ease-in-out infinite; }
.bar-target { padding-left: 14px; border-left: 1px solid var(--strip-hair); display: flex; flex-direction: column; align-items: flex-end; }
.bar-target b { font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--strip-muted); }
.bar-target i { font-family: var(--font-display); font-style: normal; font-size: 18px; }

.btn-resume { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 9px;
  min-height: 52px; padding: 0 24px; border-radius: var(--resume-radius); background: var(--resume-bg);
  color: var(--resume-ink); border: var(--resume-border); box-shadow: var(--resume-shadow);

<script>
/* ==================================================================
   Card Night — score tracker
   Single self-contained file. No build step, no dependencies.
   Open it directly, or serve it from anywhere static.
   ================================================================== */

/* ------------------------------------------------------------------
   1. CONFIG
   ------------------------------------------------------------------ */

/* Admin PIN. This gates the Admin screen against accidental changes.
   It is checked in the browser, so it is a deterrent, NOT security —
   anyone can read it by viewing source. That is proportionate here:
   anyone with the link can already edit the scores themselves. */
var ADMIN_PIN = '2468';

/* Leave null to use this device's localStorage (the default).
   To switch the whole group onto shared, live-syncing Firestore:
     1. Create a Firebase project and a Firestore database.
     2. Paste the web config object here.
     3. Add the two <script> tags noted in FirestoreStore below.
   Until then every device keeps its own copy. */
var FIREBASE_CONFIG = null;

var GAMES = [
  { id: 'spade3',    name: '3 of Spade', band: '3 of Spade', target: 500, slot: 1 },
  { id: 'kachufull', name: 'KaChuFull',  band: 'KaChuFull',  target: 200, slot: 2 }
];

var THEMES = [
  { id: 'terminal', label: 'Terminal Classic', note: 'Charcoal chrome, trapezoid plaque' },
  { id: 'slot',     label: 'Slot Machine',     note: 'Red carnival, marquee bulbs, confetti' },
  { id: 'neon',     label: 'Neon Terminal',    note: 'Indigo, flickering neon tube' },
  { id: 'tropical', label: 'Tropical Table',   note: 'Turquoise felt, arched plaque' }
];

var STORAGE_KEY = 'cardnight:v1';

/* ------------------------------------------------------------------
   2. STORE — one interface, two implementations
   ------------------------------------------------------------------ */

var LocalStore = {
  id: 'local',
  read: function () {
    try { return JSON.parse(window.localStorage.getItem(STORAGE_KEY)) || null; }
    catch (e) { return null; }
  },
  write: function (state) {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }
};

/* Same shape, backed by a single Firestore document so every phone sees
   the same scores. Activated only when FIREBASE_CONFIG is filled in.

   Add before this script:
     <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"><\/script>
     <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"><\/script>

   Then read() resolves from the cached snapshot and write() pushes the
   whole document; onSnapshot re-renders when anyone else writes. */
var FirestoreStore = {
  id: 'firestore',
  _doc: null,
  _cache: null,
  init: function (onRemoteChange) {
    firebase.initializeApp(FIREBASE_CONFIG);
    this._doc = firebase.firestore().collection('cardnight').doc('state');
    var self = this;
    this._doc.onSnapshot(function (snap) {
      self._cache = snap.exists ? snap.data().state : null;
      onRemoteChange(self._cache);
    });
  },
  read: function () { return this._cache; },
  write: function (state) { this._doc.set({ state: state }); return true; }
};

var Store = (FIREBASE_CONFIG && window.firebase) ? FirestoreStore : LocalStore;

/* ------------------------------------------------------------------
   3. STATE + MODEL
   ------------------------------------------------------------------ */

function blankState() {
  return { players: [], sessions: [], settings: { theme: 'terminal' } };
}

var state = Store.read() || blankState();
if (!state.settings) state.settings = { theme: 'terminal' };
if (!state.players) state.players = [];
if (!state.sessions) state.sessions = [];

function save() { Store.write(state); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function playerName(id) {
  for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i].name;
  return 'Unknown';
}
function gameById(id) {
  for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i];
  return { id: id, name: id, band: id, target: 0, slot: 1 };
}

/* Highest total wins — the settled scoring rule. */
function totals(session) {
  var t = {};
  session.playerIds.forEach(function (pid) { t[pid] = 0; });
  session.rounds.forEach(function (r) {
    session.playerIds.forEach(function (pid) { t[pid] += Number(r.scores[pid]) || 0; });
  });
  return t;
}

function standings(session) {
  var t = totals(session);
  return session.playerIds.map(function (pid) {
    return { id: pid, name: playerName(pid), total: t[pid] };
  }).sort(function (a, b) { return b.total - a.total; });
}

function liveSession() {
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].status === 'live') return state.sessions[i];
  return null;
}

function finishedSessions() {
  return state.sessions.filter(function (s) { return s.status === 'finished'; })
    .sort(function (a, b) { return b.finishedAt - a.finishedAt; });
}

function allTime() {
  var done = finishedSessions();
  var rows = state.players.map(function (p) {
    var played = 0, won = 0;
    done.forEach(function (s) {
      if (s.playerIds.indexOf(p.id) === -1) return;
      played++;
      if (s.winnerId === p.id) won++;
    });
    return { id: p.id, name: p.name, played: played, won: won,
             rate: played ? Math.round((won / played) * 100) : 0 };
  }).filter(function (r) { return r.played > 0; });
  rows.sort(function (a, b) { return b.rate - a.rate || b.won - a.won || b.played - a.played; });
  return rows;
}

function lastPlayed(gameId) {
  var done = state.sessions.filter(function (s) { return s.gameId === gameId; })
    .sort(function (a, b) { return (b.finishedAt || b.createdAt) - (a.finishedAt || a.createdAt); });
  if (!done.length) return 'not played yet';
  var days = Math.floor((Date.now() - (done[0].finishedAt || done[0].createdAt)) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  return days + ' days ago';
}

function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function fmtDate(ms) {
  var d = new Date(ms);
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

/* ------------------------------------------------------------------
   4. SMALL HELPERS
   ------------------------------------------------------------------ */

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
function go(hash) { location.hash = hash; }

/* ------------------------------------------------------------------
   5. ARTWORK — suits, game logos, chrome
   ------------------------------------------------------------------ */

var PATHS = {
  spade: 'M12 2.5c3 4 8.5 6.6 8.5 11a4.6 4.6 0 0 1-7.3 3.7c.2 1.6.8 3 1.8 4.3H9c1-1.3 1.6-2.7 1.8-4.3A4.6 4.6 0 0 1 3.5 13.5c0-4.4 5.5-7 8.5-11z',
  heart: 'M12 21s-7.5-4.7-9.4-9.2C1 8.3 3 4.8 6.4 4.5 8.6 4.3 10.6 5.4 12 7.2c1.4-1.8 3.4-2.9 5.6-2.7C21 4.8 23 8.3 21.4 11.8 19.5 16.3 12 21 12 21z',
  diamond: 'M12 2l7 10-7 10-7-10z',
  club: 'M12 2.6a3.7 3.7 0 0 0-3.1 5.7 3.8 3.8 0 1 0-1.3 7.3c1.2 0 2.3-.6 3-1.5-.1 2-.8 3.8-2 5.3h6.8c-1.2-1.5-1.9-3.3-2-5.3.7.9 1.8 1.5 3 1.5a3.8 3.8 0 1 0-1.3-7.3A3.7 3.7 0 0 0 12 2.6z',
  play: 'M8 5l11 7-11 7z'
};
function icon(k, size, color) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + (color || 'currentColor') +
    '" aria-hidden="true"><path d="' + PATHS[k] + '"/></svg>';
}
function lockIcon(size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg>';
}

/* logo 1 — the numeral 3 beside a solid black spade, on three fanned cards */

    return '<div style="position:absolute;left:50%;top:50%;width:82px;height:112px;margin:-64px 0 0 -41px;' +
      'background:var(--card-face);border-radius:8px;box-shadow:var(--art-shadow);' +
      'transform:rotate(' + rot + 'deg) translateX(' + dx + 'px)"></div>';
  }
  return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">' +
    card(-16, -48) + card(0, 0) + card(16, 48) +
    '<div style="position:relative;display:flex;align-items:center;gap:2px;margin-top:12px">' +
      '<span style="font-family:var(--font-display);font-size:76px;line-height:.82;color:var(--logo-ink)">3</span>' +
      '<span style="display:flex;flex-direction:column;align-items:center;gap:2px">' +
        '<span style="font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--logo-muted);text-transform:uppercase">of</span>' +
        '<span class="spademark" style="display:inline-flex;color:var(--logo-spade);filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))">' +
          icon('spade', 44) + '</span>' +
      '</span></div></div>';
}

/* logo 2 — a diagonal saltire carrying all four suits on its arms */
function logoKachu() {
  function bar(rot) {
    return '<div style="position:absolute;left:50%;top:50%;width:166px;height:11px;margin:-5.5px 0 0 -83px;' +
      'border-radius:6px;background:var(--logo-bar);transform:rotate(' + rot + 'deg)"></div>';
  }
  function suit(k, x, y, col) {
    return '<span class="kcsuit" style="position:absolute;left:50%;top:50%;margin:' + (y - 15) + 'px 0 0 ' + (x - 15) + 'px;' +
      'width:30px;height:30px;border-radius:50%;background:var(--card-face);box-shadow:var(--art-shadow);' +
      'display:flex;align-items:center;justify-content:center;color:var(' + col + ')">' + icon(k, 17) + '</span>';
  }
  return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">' +
    '<div style="position:relative;width:180px;height:180px">' +
      '<div style="position:absolute;left:50%;top:50%;width:146px;height:146px;margin:-73px 0 0 -73px;' +
        'border-radius:50%;border:2px dashed var(--logo-ring)"></div>' +
      bar(45) + bar(-45) +
      suit('spade', -58, -58, '--suit-dark') + suit('heart', 58, -58, '--suit-red') +
      suit('club', -58, 58, '--suit-dark') + suit('diamond', 58, 58, '--suit-red') +
      '<span style="position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:11px;' +
        'background:var(--logo-hub);transform:rotate(45deg);box-shadow:var(--art-shadow)"></span>' +
      '<span style="position:absolute;left:50%;top:50%;margin:-11px 0 0 -23px;width:46px;text-align:center;' +
        'font-family:var(--font-display);font-size:19px;color:var(--logo-hub-ink)">KF</span>' +
    '</div></div>';
}

function header(opts) {
  opts = opts || {};
  var bulbs = '';
  for (var i = 0; i < 13; i++) bulbs += '<i></i>';
  return '<div class="head">' +
    '<div class="rule"></div>' +
    (opts.back ? '<a class="backlink" href="#' + opts.back + '">&larr; Back</a>' : '') +
    '<div class="plaque"><div class="pshape skin">' +
      '<div class="bulbs" style="top:6px;display:none">' + bulbs + '</div>' +
      '<div class="bulbs" style="bottom:6px;display:none">' + bulbs + '</div>' +
      '<div class="wordmark">' + esc(opts.title || 'NAME TBA') + '</div>' +
      '<div class="plaque-sub">' + esc(opts.sub || 'Placeholder wordmark') + '</div>' +
    '</div></div>' +
    (opts.back ? '' : '<a class="opmark" href="#/admin">' + icon('club', 16) + '<span>card night</span></a>') +
  '</div>';
}

/* ------------------------------------------------------------------
   7. VIEWS
   ------------------------------------------------------------------ */

function viewHome() {
  var live = liveSession();
  var html = header({});

  /* live / resume bar, at the top — the settled priority */
  if (live) {
    var st = standings(live);
    var g = gameById(live.gameId);
    var scores = st.map(function (r, i) {
      return '<div class="bar-score' + (i === 0 ? ' lead' : '') + '"><b>' + esc(r.name) + '</b><i>' + r.total + '</i></div>';
    }).join('');
    html += '<div class="bar skin">' +
      '<div class="bar-icon">' + icon('spade', 21) + '</div>' +
      '<div class="bar-id"><div class="kicker"><span class="livedot"></span>Live now &middot; Round ' + live.rounds.length + '</div>' +
      '<div class="bar-game">' + esc(g.name) + '</div></div>' +
      '<div class="bar-scores">' + scores + '</div>' +
      (live.target ? '<div class="bar-target"><b>First to</b><i>' + live.target + '</i></div>' : '') +
      '<button class="btn-resume" data-go="/session/' + live.id + '">' + icon('play', 14) + ' RESUME</button>' +
      '</div>';
  } else {
    html += '<div class="bar skin">' +
      '<div class="bar-icon">' + icon('spade', 21) + '</div>' +
      '<div class="bar-id"><div class="kicker" style="color:var(--strip-muted)">No game in progress</div>' +
      '<div class="bar-game">Start a session</div></div>' +
      '<div class="bar-scores"></div>' +
      '<button class="btn-resume" data-go="/new">' + icon('play', 14) + ' NEW SESSION</button>' +
      '</div>';
  }

  /* four tiles */
  var tiles = '';
  GAMES.forEach(function (g, i) {
    var n = i + 1;
    var isLive = live && live.gameId === g.id;
    tiles += '<button class="tile tile' + n + ' skin" data-go="/new?game=' + g.id + '">' +
      '<div class="art art' + n + '"><div class="artin">' + (i === 0 ? logoSpade3() : logoKachu()) + '</div>' +
      '<span class="pill pill-meta">' + esc(lastPlayed(g.id)) + '</span>' +
      (isLive ? '<span class="pill pill-live">LIVE</span>' : '') +
      '</div><div class="band band' + n + '">' + esc(g.band) + '</div></button>';
  });
  tiles += '<div class="tile tile3 skin"><div class="art art3"><div class="artin">' + logoSoon() + '</div>' +
    '<span class="pill pill-meta">slot open</span></div>' +
    '<div class="band band3">More Coming Soon</div></div>';
  tiles += '<button class="tile tile4 skin" data-go="/archives"><div class="art art4"><div class="artin">' + logoBox() + '</div>' +
    '<span class="pill pill-meta">' + plural(finishedSessions().length, 'session') + '</span></div>' +
    '<div class="band band4">Archives</div></button>';
  html += '<div class="tiles">' + tiles + '</div>';

  html += '<div class="prompt"><div>Tap a game to start scoring</div>' +
    '<div class="dots"><span></span><span></span><span></span></div></div>';

  /* standings + recent */
  var at = allTime();
  var boardRows = at.length ? at.map(function (r, i) {
    return '<div class="row"><span class="rank' + (i === 0 ? ' top' : '') + '">' + (i + 1) + '</span>' +
      '<span class="grow">' + esc(r.name) + '</span>' +
      '<span class="dim" style="width:36px;text-align:right">' + r.played + '</span>' +
      '<span style="width:32px;text-align:right;font-weight:700">' + r.won + '</span>' +
      '<span class="num" style="width:52px;text-align:right;' + (i === 0 ? 'color:var(--acc1)' : '') + '">' + r.rate + '%</span></div>';
  }).join('') : '<div class="empty">No finished sessions yet.<br>Standings appear once a night is played out.</div>';

  var done = finishedSessions().slice(0, 5);
  var recentRows = done.length ? done.map(function (s) {
    var st2 = standings(s);
    return '<button class="row" style="width:100%;text-align:left" data-go="/session/' + s.id + '">' +
      '<span class="grow" style="max-width:110px;font-weight:600">' + esc(gameById(s.gameId).name) + '</span>' +
      '<span class="dim" style="width:56px">' + fmtDate(s.finishedAt) + '</span>' +
      '<span class="grow" style="font-weight:700;color:var(--acc2)">' + esc(playerName(s.winnerId)) + '</span>' +
      '<span class="num">' + (st2[0] ? st2[0].total : 0) + '</span></button>';
  }).join('') : '<div class="empty">Nothing in the archive yet.</div>';

  html += '<div class="grid2">' +
    '<section class="panel skin"><div class="panel-head"><h2>All-time standings</h2><span>played / won / rate</span></div>' + boardRows + '</section>' +
    '<section class="panel skin"><div class="panel-head"><h2>Recent results</h2><span>' +
      (done.length ? '<a href="#/archives">see all</a>' : 'see all') + '</span></div>' + recentRows + '</section>' +
    '</div>';

  /* first-run affordances */
  if (!state.players.length) {
    html += '<div class="panel skin" style="margin-top:14px;text-align:center">' +
      '<div class="empty" style="padding-bottom:14px">Nothing here yet — this is a fresh scoreboard.<br>' +
      'Add the people who play, or drop in a sample night to see it populated.</div>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" data-go="/players">Add players</button>' +
      '<button class="btn" id="seed">Load sample night</button></div></div>';
  } else {
    html += '<div class="btn-row" style="margin-top:16px;justify-content:center">' +
      '<button class="btn btn-nav" data-go="/players">Players</button>' +
      '<button class="btn btn-nav" data-go="/archives">Archives</button>' +
      '<button class="btn btn-nav" data-go="/admin">Admin</button></div>';
  }
  return html;
}

function viewNew(query) {
  var preset = (query.match(/game=([a-z0-9]+)/) || [])[1] || GAMES[0].id;
  var active = state.players.filter(function (p) { return p.active !== false; });
  if (!active.length) {
    return header({ back: '/' }) + '<div class="pagehead"><h1 class="title">New session</h1></div>' +
      '<div class="panel skin"><div class="empty">You need players before a session can start.</div>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" data-go="/players">Add players</button></div></div>';
  }
  var games = GAMES.map(function (g) {
    return '<button data-game="' + g.id + '" aria-pressed="' + (g.id === preset) + '">' + esc(g.name) + '</button>';
  }).join('');
  var people = active.map(function (p) {
    return '<button data-player="' + p.id + '" aria-pressed="true">' + esc(p.name) + '</button>';
  }).join('');
  return header({ back: '/' }) +
    '<div class="pagehead"><h1 class="title">New session</h1><p class="sub">Highest total wins. Enter scores round by round as you play.</p></div>' +
    '<div class="stack">' +
      '<div class="field"><label>Game</label><div class="chipsel" id="gamesel">' + games + '</div></div>' +
      '<div class="field"><label>Players &mdash; tap to include</label><div class="chipsel" id="playersel">' + people + '</div></div>' +
      '<div class="field" style="max-width:220px"><label>Target score</label>' +
        '<input class="input" id="target" type="number" inputmode="numeric" value="' + gameById(preset).target + '"></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="start">Start session</button>' +
        '<button class="btn btn-ghost" data-go="/">Cancel</button></div>' +
    '</div>';
}

function viewSession(id) {
  var s = null;
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].id === id) s = state.sessions[i];
  if (!s) return header({ back: '/' }) + '<div class="panel skin"><div class="empty">That session no longer exists.</div></div>';

  var g = gameById(s.gameId);
  var readonly = s.status === 'finished';
  var t = totals(s);
  var st = standings(s);
  var leader = st[0];

  var head = '<tr><th>Round</th>' + s.playerIds.map(function (pid) {
    return '<th>' + esc(playerName(pid)) + '</th>';
  }).join('') + '</tr>';

  var body = s.rounds.map(function (r, ri) {
    return '<tr><td class="rnum">R' + (ri + 1) + '</td>' + s.playerIds.map(function (pid) {
      var v = (r.scores[pid] === undefined || r.scores[pid] === null) ? '' : r.scores[pid];
      return '<td>' + (readonly
        ? '<span class="num">' + (v === '' ? '&mdash;' : v) + '</span>'
        : '<input class="cell" type="number" inputmode="numeric" data-round="' + ri + '" data-player="' + pid +
          '" value="' + v + '" aria-label="Round ' + (ri + 1) + ', ' + esc(playerName(pid)) + '">') + '</td>';
    }).join('') + '</tr>';
  }).join('');

  var foot = '<tr><td class="rnum">Total</td>' + s.playerIds.map(function (pid) {
    return '<td class="' + (leader && pid === leader.id ? 'lead' : '') + '">' + t[pid] + '</td>';
  }).join('') + '</tr>';
  if (s.target && !readonly) {
    foot += '<tr><td class="rnum">To go</td>' + s.playerIds.map(function (pid) {
      var left = s.target - t[pid];
      return '<td class="togo">' + (left <= 0 ? 'reached' : left) + '</td>';
    }).join('') + '</tr>';
  }

  var html = header({ back: readonly ? '/archives' : '/' }) +
    '<div class="pagehead"><h1 class="title">' + esc(g.name) + '</h1>' +
    '<p class="sub">' + (readonly
      ? 'Finished ' + fmtDate(s.finishedAt) + ' &middot; won by ' + esc(playerName(s.winnerId)) + ' &middot; ' + s.rounds.length + ' rounds'
      : 'Round ' + s.rounds.length + (s.target ? ' &middot; first to ' + s.target : '') + ' &middot; ' + s.playerIds.length + ' players') + '</p></div>' +
    '<section class="panel skin"><div class="sheetwrap"><table class="sheet">' +
      '<thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot>' +
    '</table></div>';

  if (!readonly) {
    if (!s.rounds.length) html += '<div class="empty">No rounds yet — add the first one when the hand is done.</div>';
    html += '<div class="btn-row" style="margin-top:14px">' +
      '<button class="btn btn-primary" id="addround">Add round</button>' +
      (s.rounds.length ? '<button class="btn btn-ghost" id="delround">Delete last round</button>' : '') +
      (s.rounds.length ? '<button class="btn btn-danger" id="finish">Finish session</button>' : '') +
      '</div>';
    if (s.target && leader && leader.total >= s.target) {
      html += '<div class="banner-win"><b>' + esc(leader.name) + '</b> has passed ' + s.target +
        ' with ' + leader.total + '. Finish the session to record the win.</div>';
    }
  }
  html += '</section>';
  return html;
}

function viewArchives() {
  var done = finishedSessions();
  var rows = done.length ? done.map(function (s) {
    var st = standings(s);
    return '<button class="row" style="width:100%;text-align:left" data-go="/session/' + s.id + '">' +
      '<span class="rank">' + s.rounds.length + '</span>' +
      '<span class="grow" style="max-width:130px;font-weight:600">' + esc(gameById(s.gameId).name) + '</span>' +
      '<span class="dim" style="width:62px">' + fmtDate(s.finishedAt) + '</span>' +
      '<span class="grow" style="font-weight:700;color:var(--acc2)">' + esc(playerName(s.winnerId)) + '</span>' +
      '<span class="num">' + (st[0] ? st[0].total : 0) + '</span></button>';
  }).join('') : '<div class="empty">No finished sessions yet.</div>';
  return header({ back: '/' }) + '<div class="pagehead"><h1 class="title">Archives</h1>' +
    '<p class="sub">Every night played out, newest first. Tap one to read its scoresheet.</p></div>' +
    '<section class="panel skin">' + rows + '</section>';
}

function viewPlayers() {
  var rows = state.players.length ? state.players.map(function (p) {
    return '<div class="row"><span class="rank">' + esc(p.name.slice(0, 1).toUpperCase()) + '</span>' +
      '<input class="input grow" data-rename="' + p.id + '" value="' + esc(p.name) + '" aria-label="Name">' +
      '<button class="btn btn-ghost" data-toggle="' + p.id + '">' + (p.active === false ? 'Enable' : 'Disable') + '</button>' +
      '<button class="btn btn-danger" data-remove="' + p.id + '">Remove</button></div>';
  }).join('') : '<div class="empty">No players yet.</div>';
  return header({ back: '/' }) + '<div class="pagehead"><h1 class="title">Players</h1>' +
    '<p class="sub">Everyone who plays. Disabling keeps their history but hides them from new sessions.</p></div>' +
    '<section class="panel skin">' + rows +
      '<div class="row" style="gap:10px;margin-top:10px">' +
        '<input class="input grow" id="newplayer" placeholder="Add a player" aria-label="New player name">' +
        '<button class="btn btn-primary" id="addplayer">Add</button></div>' +
    '</section>';

var adminUnlocked = false;
var pinBuffer = '';
var pinError = false;

function viewAdmin() {

          lockIcon(22) + '</span></div>' +
        '<h1 class="title" style="font-size:20px">Enter admin PIN</h1>' +

        '<div class="pindots" style="margin-bottom:18px">' + dots + '</div>' +
        '<div class="pinpad">' + keys.map(function (k) {

      '<div class="mini" data-theme="' + t.id + '"><div class="mini-plaque"></div><div class="mini-bar"></div>' +
        '<div class="mini-tiles"><i style="background:var(--band1)"></i><i style="background:var(--band2)"></i>' +
        '<i style="background:var(--band3)"></i><i style="background:var(--band4)"></i></div></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px">' +
        '<span><span style="font-family:var(--font-display);font-size:15px">' + esc(t.label) + '</span><br>' +
        '<span class="dim" style="font-size:11px">' + esc(t.note) + '</span></span>' +
        '<span class="badge' + (on ? ' active' : '') + '">' + (on ? 'Active' : 'Select') + '</span></div></button>';
  }).join('');
  return header({ back: '/', title: 'ADMIN', sub: 'Appearance' }) +
    '<div class="pagehead"><h1 class="title">Site theme</h1>' +
    '<p class="sub">Applies to this scoreboard. With Firestore configured it changes for everyone at once.</p></div>' +
    '<div class="themegrid">' + cards + '</div>' +
    '<div class="btn-row" style="margin-top:18px"><button class="btn btn-ghost" id="lock">Lock admin</button>' +
    '<button class="btn btn-danger" id="wipe">Erase all data</button></div>';
}

/* ------------------------------------------------------------------
   8. SAMPLE DATA — explicit, never silent
   ------------------------------------------------------------------ */

function loadSample() {
  var names = ['Abhi', 'Priya', 'Rahul', 'Nikhil', 'Sneha'];
  state.players = names.map(function (n) { return { id: uid(), name: n, active: true }; });
  var ids = state.players.map(function (p) { return p.id; });
  var day = 86400000;

  function makeFinished(gameId, playersIn, roundCount, daysAgo) {
    var s = { id: uid(), gameId: gameId, playerIds: playersIn, target: gameById(gameId).target,
              status: 'finished', createdAt: Date.now() - daysAgo * day, rounds: [] };
    for (var r = 0; r < roundCount; r++) {
      var sc = {};
      playersIn.forEach(function (pid) { sc[pid] = Math.floor(20 + Math.random() * 70); });
      s.rounds.push({ scores: sc });
    }
    s.finishedAt = Date.now() - daysAgo * day;
    s.winnerId = standings(s)[0].id;
    return s;
  }

  state.sessions = [
    makeFinished('spade3', ids.slice(0, 4), 8, 21),
    makeFinished('kachufull', ids.slice(1, 5), 6, 16),
    makeFinished('spade3', ids.slice(0, 4), 9, 9),
    makeFinished('kachufull', [ids[0], ids[1], ids[3]], 5, 4)
  ];

  var live = { id: uid(), gameId: 'spade3', playerIds: ids.slice(0, 4), target: 500,
               status: 'live', createdAt: Date.now(), rounds: [] };
  for (var r = 0; r < 6; r++) {
    var sc = {};
    live.playerIds.forEach(function (pid) { sc[pid] = Math.floor(40 + Math.random() * 45); });
    live.rounds.push({ scores: sc });
  }
  state.sessions.push(live);
  save();
}

/* ------------------------------------------------------------------
   9. ROUTER + EVENTS
   ------------------------------------------------------------------ */

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'terminal');
}

function render() {
  applyTheme();
  var hash = location.hash.slice(1) || '/';
  var path = hash.split('?')[0];
  var query = hash.slice(path.length);
  var app = $('#app');

  if (path === '/') app.innerHTML = viewHome();
  else if (path === '/new') app.innerHTML = viewNew(query);
  else if (path.indexOf('/session/') === 0) app.innerHTML = viewSession(path.slice(9));
  else if (path === '/archives') app.innerHTML = viewArchives();
  else if (path === '/players') app.innerHTML = viewPlayers();
  else if (path === '/admin') app.innerHTML = viewAdmin();
  else app.innerHTML = viewHome();

  window.scrollTo(0, 0);
  buildConfetti();
}

function buildConfetti() {
  var box = $('#conf');
  if (box.childNodes.length) return;
  var cols = ['#ffe066', '#2440a8', '#00a878', '#ffffff'];
  var out = '';
  for (var i = 0; i < 18; i++) {
    out += '<i style="left:' + (2 + i * 5.5) + '%;background:' + cols[i % 4] +
      ';animation-delay:' + (i * 0.31).toFixed(2) + 's;transform:rotate(' + ((i * 27) % 70) + 'deg)"></i>';
  }
  box.innerHTML = out;
}

function currentSession() {
  var path = (location.hash.slice(1) || '/').split('?')[0];
  if (path.indexOf('/session/') !== 0) return null;
  var id = path.slice(9);
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].id === id) return state.sessions[i];
  return null;
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go]');
  if (t) { go(t.getAttribute('data-go')); return; }

  /* home: sample data */
  if (e.target.id === 'seed') { loadSample(); render(); return; }

  /* new session */
  if (e.target.closest('#gamesel button')) {
    var b = e.target.closest('button');
    $$('#gamesel button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    $('#target').value = gameById(b.getAttribute('data-game')).target;
    return;
  }
  if (e.target.closest('#playersel button')) {
    var p = e.target.closest('button');
    p.setAttribute('aria-pressed', p.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    return;
  }
  if (e.target.id === 'start') {
    var gsel = $('#gamesel button[aria-pressed="true"]');
    var chosen = $$('#playersel button[aria-pressed="true"]').map(function (x) { return x.getAttribute('data-player'); });
    if (!chosen.length) { alert('Pick at least one player.'); return; }
    var s = { id: uid(), gameId: gsel.getAttribute('data-game'), playerIds: chosen,
              target: Number($('#target').value) || 0, status: 'live', createdAt: Date.now(), rounds: [] };
    state.sessions.push(s); save(); go('/session/' + s.id); return;
  }

  /* scoresheet */
  if (e.target.id === 'addround') {
    var s2 = currentSession(); if (!s2) return;
    var sc = {}; s2.playerIds.forEach(function (pid) { sc[pid] = 0; });
    s2.rounds.push({ scores: sc }); save(); render();
    var first = $('.cell[data-round="' + (s2.rounds.length - 1) + '"]');
    if (first) { first.focus(); first.select(); }
    return;
  }
  if (e.target.id === 'delround') {
    var s3 = currentSession(); if (!s3 || !s3.rounds.length) return;
    if (!confirm('Delete the last round? This cannot be undone.')) return;
    s3.rounds.pop(); save(); render(); return;
  }
  if (e.target.id === 'finish') {
    var s4 = currentSession(); if (!s4) return;
    var win = standings(s4)[0];
    if (!confirm('Finish this session? ' + win.name + ' wins with ' + win.total + '.')) return;
    s4.status = 'finished'; s4.finishedAt = Date.now(); s4.winnerId = win.id;
    save(); go('/archives'); return;
  }

  /* players */
  if (e.target.id === 'addplayer') {
    var nm = ($('#newplayer').value || '').trim();
    if (!nm) return;
    state.players.push({ id: uid(), name: nm, active: true }); save(); render(); return;
  }
  var tog = e.target.closest('[data-toggle]');
  if (tog) {
    var pid2 = tog.getAttribute('data-toggle');
    state.players.forEach(function (p) { if (p.id === pid2) p.active = p.active === false; });
    save(); render(); return;
  }
  var rem = e.target.closest('[data-remove]');
  if (rem) {
    var pid3 = rem.getAttribute('data-remove');
    var used = state.sessions.some(function (s) { return s.playerIds.indexOf(pid3) !== -1; });
    if (used) { alert('That player appears in recorded sessions, so removing them would break the history. Disable them instead.'); return; }
    state.players = state.players.filter(function (p) { return p.id !== pid3; });
    save(); render(); return;
  }

  /* admin */
  var key = e.target.closest('[data-key]');
  if (key) {
    var k = key.getAttribute('data-key');
    if (k === 'C') { pinBuffer = ''; pinError = false; }
    else if (k === 'OK') {
      if (pinBuffer === ADMIN_PIN) { adminUnlocked = true; pinBuffer = ''; pinError = false; }
      else { pinBuffer = ''; pinError = true; }
    } else if (pinBuffer.length < 4) { pinBuffer += k; pinError = false; }
    render(); return;
  }
  var th = e.target.closest('[data-theme-set]');
  if (th) { state.settings.theme = th.getAttribute('data-theme-set'); save(); render(); return; }
  if (e.target.id === 'lock') { adminUnlocked = false; go('/'); return; }
  if (e.target.id === 'wipe') {
    if (!confirm('Erase every player, session and setting on this device? This cannot be undone.')) return;
    state = blankState(); save(); adminUnlocked = false; go('/'); render(); return;
  }
});

/* live score entry — totals update as you type */
document.addEventListener('input', function (e) {
  var cell = e.target.closest('.cell');
  if (cell) {
    var s = currentSession(); if (!s) return;
    var ri = Number(cell.getAttribute('data-round'));
    var pid = cell.getAttribute('data-player');
    s.rounds[ri].scores[pid] = cell.value === '' ? 0 : Number(cell.value);
    save();
    updateTotals(s);
    return;
  }
  var ren = e.target.closest('[data-rename]');
  if (ren) {
    var id = ren.getAttribute('data-rename');
    state.players.forEach(function (p) { if (p.id === id) p.name = ren.value; });
    save();
  }
});

/* recompute the footer in place, so focus is never stolen mid-entry */
function updateTotals(s) {
  var t = totals(s);
  var st = standings(s);
  var leader = st[0];
  var foot = $$('.sheet tfoot tr');
  if (!foot.length) return;
  var cells = $$('td', foot[0]);
  s.playerIds.forEach(function (pid, i) {
    if (!cells[i + 1]) return;
    cells[i + 1].textContent = t[pid];
    cells[i + 1].className = (leader && pid === leader.id) ? 'lead' : '';
  });
  if (foot[1]) {
    var togo = $$('td', foot[1]);
    s.playerIds.forEach(function (pid, i) {
      if (!togo[i + 1]) return;
      var left = s.target - t[pid];
      togo[i + 1].textContent = left <= 0 ? 'reached' : left;
    });
  }
}

window.addEventListener('hashchange', render);
applyTheme();
render();
</script>
