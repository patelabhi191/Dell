/* plaque shape */
[data-theme="terminal"] .pshape { clip-path: polygon(0 0, 100% 0, 100% 64%, 88% 100%, 12% 100%, 0 64%); border-radius: 0; }
[data-theme="slot"] .pshape { border-radius: 10px; }
[data-theme="neon"] .pshape { border-radius: 12px; }
[data-theme="tropical"] .pshape { border-radius: 26px 26px 12px 12px; }
/* marquee bulbs: slot only */
.bulbs { display: none; }
[data-theme="slot"] .bulbs { display: flex; }
/* ambient effect: exactly one per theme */
.conf, .felt { display: none; }
[data-theme="slot"] .conf { display: block; }
[data-theme="tropical"] .felt { display: block; }
[data-theme="neon"] .wordmark { animation: dcFlicker 7s steps(1, end) infinite; }

/* ============================ base ============================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background-color: var(--bg);
  background-image: var(--bg-image);
  background-attachment: fixed;
  transition: background-color .24s ease, color .24s ease;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--acc1); }

.wrap { position: relative; max-width: 1240px; margin: 0 auto; padding: 22px 18px 40px; }
.skin { transition: background .24s ease, border-color .24s ease, color .24s ease, box-shadow .24s ease, border-radius .24s ease; }

/* ============================ header ============================ */
.head { position: relative; display: flex; align-items: center; justify-content: center; height: 84px; margin-bottom: 16px; }
.rule { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); animation: dcRule .7s cubic-bezier(.22,1,.36,1) .1s both; }
.plaque { position: relative; animation: dcPlaque .62s cubic-bezier(.34,1.56,.64,1) both; }
.pshape { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 320px; max-width: 74vw; height: 80px; padding: 0 22px;
  background: var(--plaque-bg); border: var(--plaque-border); box-shadow: var(--plaque-shadow); }
.wordmark { font-family: var(--word-family); font-size: var(--word-size); letter-spacing: var(--word-track);
  font-weight: var(--word-weight); text-shadow: var(--word-shadow); line-height: 1; color: var(--plaque-ink); white-space: nowrap; }
.plaque-sub { font-size: 9px; font-weight: 700; letter-spacing: .28em; color: var(--plaque-sub); text-transform: uppercase; margin-top: 5px; }
.opmark { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 7px;
  color: var(--mark-ink); font-family: var(--font-display); font-size: 13px; }
.backlink { position: absolute; left: 2px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 7px;
  color: var(--mark-ink); font-size: 13px; font-weight: 600; text-decoration: none; padding: 8px 12px; border-radius: 999px;
  background: var(--rank-bg); }

/* ============================ live bar ============================ */
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 14px 14px 18px; margin-bottom: 16px;
  background: var(--strip-bg); border: var(--strip-border); border-radius: var(--strip-radius); box-shadow: var(--strip-shadow);
  color: var(--strip-ink); animation: dcBar .6s cubic-bezier(.34,1.56,.64,1) .18s both; }
.bar-icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: var(--strip-icon-bg);
  display: flex; align-items: center; justify-content: center; color: var(--strip-accent); }
.bar-id { display: flex; flex-direction: column; gap: 3px; min-width: 150px; }
.kicker { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: .2em;
  color: var(--live); text-transform: uppercase; }
.livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: dcDot 1.5s ease-in-out infinite; }
.bar-game { font-family: var(--font-display); font-size: 20px; color: var(--strip-ink); }
.bar-scores { flex: 1 1 260px; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.bar-score { display: flex; flex-direction: column; gap: 1px; padding: 0 13px; }
.bar-score + .bar-score { border-left: 1px solid var(--strip-hair); }
.bar-score b { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--strip-muted); }
.bar-score i { font-family: var(--font-display); font-style: normal; font-size: 21px; line-height: 1.1; color: var(--strip-ink); }
.bar-score.lead b, .bar-score.lead i { color: var(--strip-accent); }
.bar-score.lead i { animation: dcReel 5s ease-in-out infinite; }

.btn-resume { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 9px;
  min-height: 52px; padding: 0 24px; border-radius: var(--resume-radius); background: var(--resume-bg);
  color: var(--resume-ink); border: var(--resume-border); box-shadow: var(--resume-shadow);
  font-family: var(--font-display); font-size: 15px;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.btn-resume:hover { transform: scale(1.05); }
.btn-resume::after { content: ""; position: absolute; top: 0; left: 0; width: 32%; height: 100%; pointer-events: none;

<script>
/* ==================================================================
   Card Night — score tracker
   Single self-contained file. No build step, no dependencies.
   Open it directly, or serve it from anywhere static.
   ================================================================== */

/* ------------------------------------------------------------------
   1. CONFIG
   ------------------------------------------------------------------ */

/* Admin PIN. This gates the Admin screen against accidental changes.
   It is checked in the browser, so it is a deterrent, NOT security —
   anyone can read it by viewing source. That is proportionate here:
   anyone with the link can already edit the scores themselves. */
var ADMIN_PIN = '2468';

/* Leave null to use this device's localStorage (the default).
   To switch the whole group onto shared, live-syncing Firestore:
     1. Create a Firebase project and a Firestore database.
     2. Paste the web config object here.
     3. Add the two <script> tags noted in FirestoreStore below.
   Until then every device keeps its own copy. */
var FIREBASE_CONFIG = null;

var GAMES = [
  { id: 'spade3',    name: '3 of Spade', band: '3 of Spade', slot: 1, roundType: 'bid' },
  { id: 'kachufull', name: 'KaChuFull',  band: 'KaChuFull',  slot: 2, roundType: 'numeric' }
];

/* A single deck holds 250 points: (4 suits x 50 for A/K/Q/J/10) + 30 for the
   3 of Spades + 20 for the four 5s. Two decks, 500. This caps a bid. */
var DECK_POINTS = 250;

var RANKS = ['A', 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];
var SUITS = [
  { id: 'S', name: 'Spades',   glyph: '\u2660', red: false },
  { id: 'H', name: 'Hearts',   glyph: '\u2665', red: true  },
  { id: 'D', name: 'Diamonds', glyph: '\u2666', red: true  },
  { id: 'C', name: 'Clubs',    glyph: '\u2663', red: false }
];
function suitById(id) {
  for (var i = 0; i < SUITS.length; i++) if (SUITS[i].id === id) return SUITS[i];
  return SUITS[0];
}
function cardLabel(c) { return c ? (c.rank + suitById(c.suit).glyph) : '--'; }
function cardIsRed(c) { return c ? suitById(c.suit).red : false; }

var THEMES = [
  { id: 'terminal', label: 'Terminal Classic', note: 'Charcoal chrome, trapezoid plaque' },
  { id: 'slot',     label: 'Slot Machine',     note: 'Red carnival, marquee bulbs, confetti' },
  { id: 'neon',     label: 'Neon Terminal',    note: 'Indigo, flickering neon tube' },
  { id: 'tropical', label: 'Tropical Table',   note: 'Turquoise felt, arched plaque' }
];

var STORAGE_KEY = 'cardnight:v1';

/* ------------------------------------------------------------------
   2. STORE — one interface, two implementations
   ------------------------------------------------------------------ */

var LocalStore = {
  id: 'local',
  read: function () {
    try { return JSON.parse(window.localStorage.getItem(STORAGE_KEY)) || null; }
    catch (e) { return null; }
  },
  write: function (state) {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }
};

/* Same shape, backed by a single Firestore document so every phone sees
   the same scores. Activated only when FIREBASE_CONFIG is filled in.

   Add before this script:
     <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"><\/script>
     <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"><\/script>

   Then read() resolves from the cached snapshot and write() pushes the
   whole document; onSnapshot re-renders when anyone else writes. */
var FirestoreStore = {
  id: 'firestore',
  _doc: null,
  _cache: null,
  init: function (onRemoteChange) {
    firebase.initializeApp(FIREBASE_CONFIG);
    this._doc = firebase.firestore().collection('cardnight').doc('state');
    var self = this;
    this._doc.onSnapshot(function (snap) {
      self._cache = snap.exists ? snap.data().state : null;
      onRemoteChange(self._cache);
    });
  },
  read: function () { return this._cache; },
  write: function (state) { this._doc.set({ state: state }); return true; }
};

var Store = (FIREBASE_CONFIG && window.firebase) ? FirestoreStore : LocalStore;

/* ------------------------------------------------------------------
   3. STATE + MODEL
   ------------------------------------------------------------------ */

function blankState() {
  return { players: [], sessions: [], settings: { theme: 'terminal' } };
}

var state = Store.read() || blankState();
if (!state.settings) state.settings = { theme: 'terminal' };
if (!state.players) state.players = [];
if (!state.sessions) state.sessions = [];

function save() { Store.write(state); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function playerName(id) {
  for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i].name;
  return 'Unknown';
}
function gameById(id) {
  for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i];
  return { id: id, name: id, band: id, slot: 1, roundType: 'numeric' };
}

/* Sessions stored before bid scoring existed carry no roundType; they are
   numeric, so nothing already recorded changes meaning. */
function isBid(s) { return s.roundType === 'bid'; }

/* One deck 250, two decks 500. Caps the bid. */
function deckMax(s) {
  var n = Number(s.deckCount) || 1;
  if (n < 1) n = 1;
  if (n > 3) n = 3;
  return n * DECK_POINTS;
}

/* Who is on the bidder's side this hand, and how many shares each holds.
   The bidder holds one share for bidding; a called-card holder holds one
   share per called card they turned out to have -- so a player holding two
   of them takes twice the bid. That is the dual partner. */
function biddingShares(r) {
  var shares = {};
  if (!r.bidderId) return shares;
  shares[r.bidderId] = 1;
  (r.calls || []).forEach(function (c) {
    if (!c.holderId) return;
    shares[c.holderId] = (shares[c.holderId] || 0) + 1;
  });
  return shares;
}

/* What one hand pays each player. */
function roundPoints(s, r) {
  var out = {};
  s.playerIds.forEach(function (pid) { out[pid] = 0; });

  if (!isBid(s)) {
    s.playerIds.forEach(function (pid) { out[pid] = Number((r.scores || {})[pid]) || 0; });
    return out;
  }

  /* a hand still waiting on the partner reveal pays nothing yet */
  if (r.stage !== 'done' || !r.winner) return out;

  var shares = biddingShares(r);
  if (r.winner === 'bidding') {
    s.playerIds.forEach(function (pid) { out[pid] = (shares[pid] || 0) * r.bid; });
  } else {
    s.playerIds.forEach(function (pid) { out[pid] = shares[pid] ? 0 : r.bid; });
  }
  return out;
}

function totals(session) {
  var t = {};
  session.playerIds.forEach(function (pid) { t[pid] = 0; });
  session.rounds.forEach(function (r) {
    var rp = roundPoints(session, r);
    session.playerIds.forEach(function (pid) { t[pid] += rp[pid]; });
  });
  return t;
}

function standings(session) {
  var t = totals(session);
  return session.playerIds.map(function (pid) {
    return { id: pid, name: playerName(pid), total: t[pid] };
  }).sort(function (a, b) { return b.total - a.total; });
}

function pendingRound(s) {
  for (var i = 0; i < s.rounds.length; i++) if (s.rounds[i].stage === 'bid') return s.rounds[i];
  return null;
}

function liveSession() {
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].status === 'live') return state.sessions[i];
  return null;
}

function finishedSessions() {
  return state.sessions.filter(function (s) { return s.status === 'finished'; })
    .sort(function (a, b) { return b.finishedAt - a.finishedAt; });
}

function allTime() {
  var done = finishedSessions();
  var rows = state.players.map(function (p) {
    var played = 0, won = 0;
    done.forEach(function (s) {
      if (s.playerIds.indexOf(p.id) === -1) return;
      played++;
      if (s.winnerId === p.id) won++;
    });
    return { id: p.id, name: p.name, played: played, won: won,
             rate: played ? Math.round((won / played) * 100) : 0 };
  }).filter(function (r) { return r.played > 0; });
  rows.sort(function (a, b) { return b.rate - a.rate || b.won - a.won || b.played - a.played; });
  return rows;
}

function lastPlayed(gameId) {
  var done = state.sessions.filter(function (s) { return s.gameId === gameId; })
    .sort(function (a, b) { return (b.finishedAt || b.createdAt) - (a.finishedAt || a.createdAt); });
  if (!done.length) return 'not played yet';
  var days = Math.floor((Date.now() - (done[0].finishedAt || done[0].createdAt)) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  return days + ' days ago';
}

function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function fmtDate(ms) {
  var d = new Date(ms);
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

function esc(s) {

  });
}

               '<button class="btn btn-ghost" data-cancelhand="' + idx + '">Discard round</button></div>' : '') +

function bidAddForm(s) {

    var defRank = RANKS[i % RANKS.length];

      '<select class="input" data-rank="' + i + '">' +

      '</select>' +

function bidStandingsSheet(s) {
  var t = totals(s);
  var st = standings(s);
  var leader = st[0];
  var head = '<tr><th>Round</th>' + s.playerIds.map(function (pid) {
    return '<th>' + esc(playerName(pid)) + '</th>';
  }).join('') + '</tr>';
  var body = s.rounds.map(function (r, ri) {
    var pts = roundPoints(s, r);
    var pending = r.stage !== 'done';
    return '<tr' + (pending ? ' class="pending"' : '') + '><td class="rnum">Round ' + (ri + 1) + '</td>' +
      s.playerIds.map(function (pid) {
        return '<td>' + (pending ? '&mdash;' : '+' + pts[pid]) + '</td>';
      }).join('') + '</tr>';
  }).join('');
  var foot = '<tr><td class="rnum">Total</td>' + s.playerIds.map(function (pid) {
    return '<td class="' + (leader && pid === leader.id ? 'lead' : '') + '">' + t[pid] + '</td>';
  }).join('') + '</tr>';
  return '<section class="panel skin"><div class="panel-head"><h2>Standings</h2><span>this session</span></div>' +

function viewSession(id) {
  var s = null;
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].id === id) s = state.sessions[i];
  if (!s) return header({ back: '/' }) + '<div class="panel skin"><div class="empty">That session no longer exists.</div></div>';

  var g = gameById(s.gameId);
  var readonly = s.status === 'finished';
  var st = standings(s);

  var sub = readonly
    ? 'Finished ' + fmtDate(s.finishedAt) + ' &middot; won by ' + esc(playerName(s.winnerId)) + ' &middot; ' + plural(s.rounds.length, 'round')
    : plural(s.rounds.length, 'round') + ' played &middot; ' + plural(s.playerIds.length, 'player') +
      (isBid(s) ? ' &middot; ' + plural(Number(s.deckCount) || 1, 'deck') + ' &middot; ' +
        plural(s.partnerCount || 1, 'partner') : '');

  var html = header({ back: readonly ? '/archives' : '/' }) +
    '<div class="pagehead"><h1 class="title">' + esc(g.name) + '</h1><p class="sub">' + sub + '</p></div>';

  if (isBid(s)) {
    /* names across one row, each round's points below as Round 1, Round 2, ... */
    html += bidStandingsSheet(s);
    var pend = pendingRound(s);
    html += '<section class="panel skin" style="margin-top:14px">' +
      '<div class="panel-head"><h2>Rounds</h2><span>' + plural(s.rounds.length, 'round') + '</span></div>' +
      (s.rounds.length
        ? s.rounds.map(function (r, i) { return bidHandRow(s, r, i); }).join('')
        : '<div class="empty">No rounds yet &mdash; add one when the bidding is done.</div>') +
      '</section>';

    if (!readonly) {
      if (revealingIdx >= 0 && s.rounds[revealingIdx]) html += bidRevealForm(s, s.rounds[revealingIdx], revealingIdx);
      else if (addingHand) html += bidAddForm(s);
      else {
        html += '<div class="btn-row" style="margin-top:14px">' +
          (pend ? '' : '<button class="btn btn-primary" id="addhand">Add round</button>') +
          (s.rounds.length ? '<button class="btn btn-danger" id="finish">Finish session</button>' : '') +
          '</div>';
        if (pend) html += '<p class="hint" style="margin-top:10px">Reveal the partners on round ' +
          (s.rounds.indexOf(pend) + 1) + ' before starting the next one.</p>';
      }
    }
    return html;
  }

  /* numeric games — unchanged one-number-per-player grid, plus its own standings list */
  html += '<section class="panel skin"><div class="panel-head"><h2>Standings</h2><span>this session</span></div>' +
    st.map(function (r, i) {
      return '<div class="row"><span class="rank' + (i === 0 ? ' top' : '') + '">' + (i + 1) + '</span>' +
        '<span class="grow" style="font-weight:600">' + esc(r.name) + '</span>' +
        '<span class="num" style="' + (i === 0 ? 'color:var(--acc1)' : '') + '">' + r.total + '</span></div>';
    }).join('') + '</section>';

  var t = totals(s);
  var leader = st[0];
  var head = '<tr><th>Round</th>' + s.playerIds.map(function (pid) {
    return '<th>' + esc(playerName(pid)) + '</th>';
  }).join('') + '</tr>';
  var body = s.rounds.map(function (r, ri) {
    return '<tr><td class="rnum">R' + (ri + 1) + '</td>' + s.playerIds.map(function (pid) {
      var v = ((r.scores || {})[pid] === undefined) ? '' : r.scores[pid];
      return '<td>' + (readonly
        ? '<span class="num">' + (v === '' ? '&mdash;' : v) + '</span>'

          '" value="' + v + '" aria-label="Round ' + (ri + 1) + ', ' + esc(playerName(pid)) + '">') + '</td>';
    }).join('') + '</tr>';

  var foot = '<tr><td class="rnum">Total</td>' + s.playerIds.map(function (pid) {
    return '<td class="' + (leader && pid === leader.id ? 'lead' : '') + '">' + t[pid] + '</td>';
  }).join('') + '</tr>';

  html += '<section class="panel skin" style="margin-top:14px"><div class="sheetwrap"><table class="sheet">' +
      '<thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot>' +
    '</table></div>';
  if (!readonly) {
    if (!s.rounds.length) html += '<div class="empty">No rounds yet.</div>';
    html += '<div class="btn-row" style="margin-top:14px">' +
      '<button class="btn btn-primary" id="addround">Add round</button>' +
      (s.rounds.length ? '<button class="btn btn-ghost" id="delround">Delete last round</button>' : '') +
      (s.rounds.length ? '<button class="btn btn-danger" id="finish">Finish session</button>' : '') +
      '</div>';
  }
  html += '</section>';
  return html;
}

function loadSample() {
  var names = ['Abhi', 'Priya', 'Rahul', 'Nikhil', 'Sneha'];
  state.players = names.map(function (n) { return { id: uid(), name: n, active: true }; });
  var ids = state.players.map(function (p) { return p.id; });
  var day = 86400000;
  var suits = ['S', 'H', 'D', 'C'];
  var ranks = ['A', 'K', 'Q', 'J', '10'];

  function bidHand(playersIn, bidderIdx, bid, holderIdxs, won, seed) {
    return {
      stage: 'done',
      bidderId: playersIn[bidderIdx],
      bid: bid,
      sir: suits[seed % 4],
      calls: holderIdxs.map(function (hi, n) {
        return { card: { rank: ranks[(seed + n) % ranks.length], suit: suits[(seed + n + 1) % 4] },
                 holderId: playersIn[hi] };
      }),
      winner: won ? 'bidding' : 'opposition'
    };
  }

  function spadeSession(playersIn, partnerCount, deckCount, hands, daysAgo) {
    var s = { id: uid(), gameId: 'spade3', roundType: 'bid', playerIds: playersIn,
              deckCount: deckCount, partnerCount: partnerCount,
              status: 'finished', createdAt: Date.now() - daysAgo * day, rounds: [] };
    for (var h = 0; h < hands; h++) {
      var b = h % playersIn.length;
      var holders = [];
      for (var k = 0; k < partnerCount; k++) {
        var pick = (b + 1 + k) % playersIn.length;
        holders.push(pick);
      }
      s.rounds.push(bidHand(playersIn, b, 150 + ((h * 10) % 80), holders, h % 3 !== 0, h));
    }
    s.finishedAt = Date.now() - daysAgo * day;
    s.winnerId = standings(s)[0].id;
    return s;
  }

  function numericSession(playersIn, rounds, daysAgo) {
    var s = { id: uid(), gameId: 'kachufull', roundType: 'numeric', playerIds: playersIn,
              status: 'finished', createdAt: Date.now() - daysAgo * day, rounds: [] };
    for (var r = 0; r < rounds; r++) {
      var sc = {};
      playersIn.forEach(function (pid) { sc[pid] = Math.floor(20 + Math.random() * 60); });
      s.rounds.push({ scores: sc });
    }
    s.finishedAt = Date.now() - daysAgo * day;
    s.winnerId = standings(s)[0].id;
    return s;
  }

  state.sessions = [
    spadeSession(ids.slice(0, 4), 1, 1, 6, 21),
    numericSession(ids.slice(1, 5), 5, 16),
    spadeSession(ids.slice(0, 4), 2, 2, 5, 9)
  ];

  /* one night still in progress, with a hand awaiting its reveal */
  var live = { id: uid(), gameId: 'spade3', roundType: 'bid', playerIds: ids.slice(0, 4),
               deckCount: 1, partnerCount: 1, status: 'live', createdAt: Date.now(), rounds: [] };
  live.rounds.push(bidHand(live.playerIds, 0, 180, [1], true, 0));
  live.rounds.push(bidHand(live.playerIds, 2, 165, [0], false, 3));
  state.sessions.push(live);
  save();
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'terminal');
}

var firstRender = true;

function render() {
  applyTheme();
  /* The entrance reveal is armed for the first paint only. Any later render —
     a tap, a route change — settles the body BEFORE the markup swap, so the
     new nodes never replay the fade-in from zero. Without this, a tap inside
     the first 1.3s replayed the whole entrance and read as a blank screen. */
  if (!firstRender) document.body.classList.add('settled');
  var hash = location.hash.slice(1) || '/';
  var path = hash.split('?')[0];
  var query = hash.slice(path.length);
  var app = $('#app');

  if (path === '/') app.innerHTML = viewHome();
  else if (path === '/new') app.innerHTML = viewNew(query);
  else if (path.indexOf('/session/') === 0) app.innerHTML = viewSession(path.slice(9));
  else if (path === '/archives') app.innerHTML = viewArchives();
  else if (path === '/players') app.innerHTML = viewPlayers();
  else if (path === '/admin') app.innerHTML = viewAdmin();
  else app.innerHTML = viewHome();

  window.scrollTo(0, 0);
  buildConfetti();
  if (addingHand) syncCardPickers();
  firstRender = false;
}

function buildConfetti() {
  var box = $('#conf');
  if (box.childNodes.length) return;
  var cols = ['#ffe066', '#2440a8', '#00a878', '#ffffff'];
  var out = '';
  for (var i = 0; i < 18; i++) {
    out += '<i style="left:' + (2 + i * 5.5) + '%;background:' + cols[i % 4] +
      ';animation-delay:' + (i * 0.31).toFixed(2) + 's;transform:rotate(' + ((i * 27) % 70) + 'deg)"></i>';
  }
  box.innerHTML = out;
}

function currentSession() {
  var path = (location.hash.slice(1) || '/').split('?')[0];
  if (path.indexOf('/session/') !== 0) return null;
  var id = path.slice(9);
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].id === id) return state.sessions[i];
  return null;
}

/* Each called card is two independent selects (rank, suit), so a "card" is a
   pair across two controls — live duplicate prevention has to consider both
   together. After any picker changes, disable the suit option in every OTHER
   picker that would recreate an already-used rank+suit pair for that
   picker's own current rank; if a picker's own selection was just made
   invalid by someone else's edit, nudge it to the first free suit rather
   than leave a silent duplicate selected. The submit-time check in
   'savehand' stays as a safety net for whatever this can't reach. */
function syncCardPickers() {
  var rows = $$('.cardpick');
  var n = rows.length;
  if (!n) return;

  var combos = [];
  for (var i = 0; i < n; i++) {
    var rankSel = $('[data-rank="' + i + '"]');
    var suitSel = $('[data-suit="' + i + '"]');
    combos.push({
      rankSel: rankSel, suitSel: suitSel,
      rank: rankSel ? rankSel.value : null,
      suit: suitSel ? suitSel.value : null
    });
  }

  function takenElsewhere(idx, rank, suit) {
    for (var k = 0; k < n; k++) {
      if (k === idx) continue;
      if (combos[k].rank === rank && combos[k].suit === suit) return true;
    }
    return false;
  }

  /* Pass one: nudge any picker that now duplicates another off the clash,
     writing the new value straight back into combos so the next picker sees
     where this one actually landed rather than where it used to be. */
  for (var j = 0; j < n; j++) {
    var c = combos[j];
    if (!c.suitSel || !takenElsewhere(j, c.rank, c.suit)) continue;
    var opts = $$('option', c.suitSel);
    for (var o = 0; o < opts.length; o++) {
      if (takenElsewhere(j, c.rank, opts[o].value)) continue;
      c.suitSel.value = opts[o].value;
      c.suit = opts[o].value;
      break;
    }
  }

  /* Pass two: grey out the suits that would recreate a pair someone else
     holds, now that every picker's value is final. */
  for (var m = 0; m < n; m++) {
    var cm = combos[m];
    if (!cm.suitSel) continue;
    (function (idx, rank) {
      $$('option', combos[idx].suitSel).forEach(function (opt) {
        opt.disabled = takenElsewhere(idx, rank, opt.value);
      });
    })(m, cm.rank);
  }
}

document.addEventListener('change', function (e) {
  if (e.target.closest && e.target.closest('.cardpicks')) syncCardPickers();
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go]');
  if (t) { addingHand = false; revealingIdx = -1; go(t.getAttribute('data-go')); return; }

  if (e.target.id === 'seed') { loadSample(); render(); return; }

  /* ---------- new session ---------- */
  if (e.target.closest('#playersel button')) {
    var p = e.target.closest('button');
    p.setAttribute('aria-pressed', p.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    return;
  }
  var deckBtn = e.target.closest('#decksel button');
  if (deckBtn) {
    pickOne($('#decksel'), deckBtn);
    var hint = $('#deckhint');
    if (hint) hint.textContent = 'Bids can go up to ' + (Number(deckBtn.getAttribute('data-deck')) * DECK_POINTS) + '.';
    return;
  }
  var partBtn = e.target.closest('#partsel button');
  if (partBtn) { pickOne($('#partsel'), partBtn); return; }

  if (e.target.id === 'start') {
    var gid = e.target.getAttribute('data-game');
    var g = gameById(gid);
    var chosen = $$('#playersel button[aria-pressed="true"]').map(function (x) { return x.getAttribute('data-player'); });
    if (g.roundType === 'bid' && chosen.length < 3) {
      alert('3 of Spade needs at least three players — a bidder, a partner and someone to play against.');
      return;
    }
    if (!chosen.length) { alert('Pick at least one player.'); return; }
    var sess = { id: uid(), gameId: gid, roundType: g.roundType, playerIds: chosen,
                 status: 'live', createdAt: Date.now(), rounds: [] };
    if (g.roundType === 'bid') {
      sess.deckCount = Number(pickedValue('#decksel', 'data-deck')) || 1;
      sess.partnerCount = Number(pickedValue('#partsel', 'data-part')) || 1;
    }
    state.sessions.push(sess); save(); go('/session/' + sess.id); return;
  }

  /* ---------- bid hands ---------- */
  if (e.target.id === 'addhand') { addingHand = true; render(); return; }
  if (e.target.id === 'cancelhand') { addingHand = false; render(); return; }
  var bsel = e.target.closest('#biddersel button');
  if (bsel) { pickOne($('#biddersel'), bsel); return; }
  var ssel = e.target.closest('#sirsel button');
  if (ssel) { pickOne($('#sirsel'), ssel); return; }

  if (e.target.id === 'savehand') {
    var s1 = currentSession(); if (!s1) return;
    var bidderId = pickedValue('#biddersel', 'data-pickbidder');
    if (!bidderId) { alert('Pick who won the bid.'); return; }
    var amt = Number($('#bidamt').value);
    if (!amt || amt < 1 || amt > deckMax(s1)) { alert('Bid must be between 1 and ' + deckMax(s1) + '.'); return; }
    var calls = [];
    for (var ci = 0; ci < (s1.partnerCount || 1); ci++) {
      calls.push({ card: { rank: $('[data-rank="' + ci + '"]').value, suit: $('[data-suit="' + ci + '"]').value },
                   holderId: null });
    }
    var seen = {};
    for (var k = 0; k < calls.length; k++) {
      var key = calls[k].card.rank + calls[k].card.suit;
      if (seen[key]) { alert('The same card cannot be asked for twice in one round.'); return; }
      seen[key] = true;
    }
    s1.rounds.push({ stage: 'bid', bidderId: bidderId, bid: amt,
                     sir: pickedValue('#sirsel', 'data-picksir') || 'S', calls: calls, winner: null });
    addingHand = false; save(); render(); return;
  }

  var rev = e.target.closest('[data-reveal]');
  if (rev) { revealingIdx = Number(rev.getAttribute('data-reveal')); render(); return; }
  if (e.target.id === 'cancelreveal') { revealingIdx = -1; render(); return; }

  var disc = e.target.closest('[data-cancelhand]');
  if (disc) {
    var s2 = currentSession(); if (!s2) return;
    if (!confirm('Discard this round? Nothing has been scored from it yet.')) return;
    s2.rounds.splice(Number(disc.getAttribute('data-cancelhand')), 1);
    revealingIdx = -1; save(); render(); return;
  }

  var hold = e.target.closest('[data-holder]');
  if (hold) {
    pickOne(hold.parentNode, hold);
    var s3 = currentSession(); if (!s3 || revealingIdx < 0) return;
    s3.rounds[revealingIdx].calls[Number(hold.getAttribute('data-holder'))].holderId = hold.getAttribute('data-hp');
    save(); return;
  }

  var win = e.target.closest('[data-win]');
  if (win) {
    var s4 = currentSession(); if (!s4) return;
    var idx = Number(win.getAttribute('data-ridx'));
    var r = s4.rounds[idx];
    var missing = r.calls.some(function (c) { return !c.holderId; });
    if (missing) { alert('Say who held each called card first.'); return; }
    var shares = biddingShares(r);
    if (s4.playerIds.filter(function (pid) { return !shares[pid]; }).length === 0) {
      alert('Everyone cannot be on the bidding side — someone has to be the opposition.');
      return;
    }
    r.winner = win.getAttribute('data-win');
    r.stage = 'done';
    revealingIdx = -1; save(); render(); return;
  }

  /* ---------- numeric rounds ---------- */
  if (e.target.id === 'addround') {
    var s5 = currentSession(); if (!s5) return;
    var sc = {}; s5.playerIds.forEach(function (pid) { sc[pid] = 0; });
    s5.rounds.push({ scores: sc }); save(); render();
    var first = $('.cell[data-round="' + (s5.rounds.length - 1) + '"]');
    if (first) { first.focus(); first.select(); }
    return;
  }
  if (e.target.id === 'delround') {
    var s6 = currentSession(); if (!s6 || !s6.rounds.length) return;
    if (!confirm('Delete the last round? This cannot be undone.')) return;
    s6.rounds.pop(); save(); render(); return;
  }

  if (e.target.id === 'finish') {
    var s7 = currentSession(); if (!s7) return;
    if (pendingRound(s7)) { alert('Finish revealing the last round before closing the session.'); return; }
    var winr = standings(s7)[0];
    if (!confirm('Finish this session? ' + winr.name + ' wins with ' + winr.total + '.')) return;
    s7.status = 'finished'; s7.finishedAt = Date.now(); s7.winnerId = winr.id;
    save(); go('/archives'); return;
  }

  /* ---------- players ---------- */
  if (e.target.id === 'addplayer') {
    var nm = ($('#newplayer').value || '').trim();
    if (!nm) return;
    state.players.push({ id: uid(), name: nm, active: true }); save(); render(); return;
  }
  var tog = e.target.closest('[data-toggle]');
  if (tog) {
    var pid2 = tog.getAttribute('data-toggle');
    state.players.forEach(function (p) { if (p.id === pid2) p.active = p.active === false; });
    save(); render(); return;
  }
  var rem = e.target.closest('[data-remove]');
  if (rem) {
    var pid3 = rem.getAttribute('data-remove');
    var used = state.sessions.some(function (s) { return s.playerIds.indexOf(pid3) !== -1; });
    if (used) { alert('That player appears in recorded sessions, so removing them would break the history. Disable them instead.'); return; }
    state.players = state.players.filter(function (p) { return p.id !== pid3; });
    save(); render(); return;
  }

  /* ---------- admin ---------- */
  var key = e.target.closest('[data-key]');
  if (key) {
    var k = key.getAttribute('data-key');
    if (k === 'C') { pinBuffer = ''; updatePinDots(false); return; }
    if (k === 'OK') {
      if (pinBuffer === ADMIN_PIN) { adminUnlocked = true; pinBuffer = ''; render(); return; }
      pinBuffer = ''; updatePinDots(true); return;
    }
    if (pinBuffer.length < 4) { pinBuffer += k; updatePinDots(false); }
    return;
  }
  var th = e.target.closest('[data-theme-set]');
  if (th) { state.settings.theme = th.getAttribute('data-theme-set'); save(); render(); return; }
  if (e.target.id === 'lock') { adminUnlocked = false; go('/'); return; }
  if (e.target.id === 'wipe') {
    if (!confirm('Erase every player, session and setting on this device? This cannot be undone.')) return;
    state = blankState(); save(); adminUnlocked = false; go('/'); render(); return;
  }
});

document.addEventListener('input', function (e) {
  var cell = e.target.closest('.cell');
  if (cell) {
    var s = currentSession(); if (!s) return;
    var ri = Number(cell.getAttribute('data-round'));
    var pid = cell.getAttribute('data-player');
    s.rounds[ri].scores[pid] = cell.value === '' ? 0 : Number(cell.value);
    save();
    updateTotals(s);
    return;
  }
  var ren = e.target.closest('[data-rename]');
  if (ren) {
    var id = ren.getAttribute('data-rename');
    state.players.forEach(function (p) { if (p.id === id) p.name = ren.value; });
    save();
  }
});

/* recompute the numeric footer in place, so focus is never stolen mid-entry */
function updateTotals(s) {
  var t = totals(s);
  var st = standings(s);
  var leader = st[0];
  var foot = $$('.sheet tfoot tr');
  if (!foot.length) return;
  var cells = $$('td', foot[0]);
  s.playerIds.forEach(function (pid, i) {
    if (!cells[i + 1]) return;
    cells[i + 1].textContent = t[pid];
    cells[i + 1].className = (leader && pid === leader.id) ? 'lead' : '';
  });
}

window.addEventListener('hashchange', render);
applyTheme();
render();
setTimeout(function () { document.body.classList.add('settled'); }, 1300);
</script>
