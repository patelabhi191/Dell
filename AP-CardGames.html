  --ground-ink: #14141a;
  --ground-muted: #6b6862;
  --bulb: #e2a01a;
  --bulb-glow: rgba(226,160,26,0.70);
}

/* plaque shape */
[data-theme="terminal"] .pshape { clip-path: polygon(0 0, 100% 0, 100% 64%, 88% 100%, 12% 100%, 0 64%); border-radius: 0; }
[data-theme="slot"] .pshape { border-radius: 10px; }
[data-theme="neon"] .pshape { border-radius: 12px; }
[data-theme="tropical"] .pshape { border-radius: 26px 26px 12px 12px; }
/* marquee bulbs: slot only */
.bulbs { display: none; }
[data-theme="slot"] .bulbs { display: flex; }
/* ambient effect: exactly one per theme */
.conf, .felt { display: none; }
[data-theme="slot"] .conf { display: block; }
[data-theme="tropical"] .felt { display: block; }
[data-theme="neon"] .wordmark { animation: dcFlicker 7s steps(1, end) infinite; }
[data-theme="glassdark"] .pshape, [data-theme="glasslight"] .pshape { border-radius: 22px; }
[data-theme="midnight"] .pshape { border-radius: 14px; }
[data-theme="daylight"] .pshape { border-radius: 14px; }
[data-theme="glasslight"] body { background-size: 100% 100%, auto, auto; background-repeat: no-repeat; }
/* frosted glass: the chrome is blurred, never the rows inside it. Dozens of
   backdrop-filtered layers per screen is what makes glassmorphism crawl on a
   phone, and rows sitting on an already-frosted panel gain nothing from it. */
/* Material tiers. iOS does not blur everything by the same amount — nav
   chrome is a thinner, brighter material than the cards it floats over, and
   the filter darkens (or lightens) the backdrop as well as blurring it. That
   difference between tiers is most of what reads as depth. */
:is([data-theme="glassdark"], [data-theme="glasslight"])
  :is(.pshape, .deskhead, .pagehead, .tabs, .livecount, .backlink, .opmark) {
  -webkit-backdrop-filter: blur(30px) saturate(190%) brightness(0.88);
  backdrop-filter: blur(30px) saturate(190%) brightness(0.88);
}
:is([data-theme="glassdark"], [data-theme="glasslight"])
  :is(.bar, .panel, .console, .podwrap, .ledger, .sheetpanel, .setpanel, .themecard, .tile) {
  -webkit-backdrop-filter: blur(22px) saturate(175%) brightness(0.94);
  backdrop-filter: blur(22px) saturate(175%) brightness(0.94);
}
[data-theme="glasslight"]
  :is(.pshape, .deskhead, .pagehead, .tabs, .livecount, .backlink, .opmark) {
  -webkit-backdrop-filter: blur(30px) saturate(190%) brightness(1.08);
  backdrop-filter: blur(30px) saturate(190%) brightness(1.08);
}
[data-theme="glasslight"]
  :is(.bar, .panel, .console, .podwrap, .ledger, .sheetpanel, .setpanel, .themecard, .tile) {
  -webkit-backdrop-filter: blur(22px) saturate(175%) brightness(1.04);
  backdrop-filter: blur(22px) saturate(175%) brightness(1.04);
}
/* the glass skins want iOS geometry: continuous corners and hairline rules */
:is([data-theme="glassdark"], [data-theme="glasslight"]) :is(.pod, .pick, .lrow, .row) {
  border-radius: 12px;
}

/* ============================ base ============================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background-color: var(--bg);
  background-image: var(--bg-image);
  background-attachment: fixed;
  transition: background-color .24s ease, color .24s ease;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
/* buttons carry a UA default padding of 1px 6px; the tiles are buttons, so
   that padding was insetting their artwork and leaving a hairline of the
   tile's own background showing inside the rounded frame */
button { cursor: pointer; border: none; background: none; padding: 0; }
a { color: var(--acc1-text); }

.wrap { position: relative; max-width: 1240px; margin: 0 auto; padding: 22px 18px 40px; }
.skin { transition: background .24s ease, border-color .24s ease, color .24s ease, box-shadow .24s ease, border-radius .24s ease; }

/* ============================ header ============================ */
.head { position: relative; display: flex; align-items: center; justify-content: center; height: 84px; margin-bottom: 16px; }
.rule { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); animation: dcRule .7s cubic-bezier(.22,1,.36,1) .1s both; }
.plaque { position: relative; animation: dcPlaque .62s cubic-bezier(.34,1.56,.64,1) both; }
.pshape { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 430px; max-width: 88vw; height: 80px; padding: 0 22px;
  background: var(--plaque-bg); border: var(--plaque-border); box-shadow: var(--plaque-shadow); }
.wordmark { font-family: var(--word-family); font-size: calc(var(--word-size) * .76); letter-spacing: var(--word-track);
  font-weight: var(--word-weight); text-shadow: var(--word-shadow); line-height: 1; color: var(--plaque-ink); white-space: nowrap; }
.plaque-sub { font-size: 9px; font-weight: 700; letter-spacing: .28em; color: var(--plaque-sub); text-transform: uppercase; margin-top: 5px; }
.opmark, .backlink { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center;
  gap: 7px; padding: 8px 14px; border-radius: 999px; text-decoration: none; font-size: 13px;
  background: var(--ground-plate); color: var(--ground-ink);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), filter .18s ease; }
.opmark { right: 2px; font-family: var(--font-display); }
.backlink { left: 2px; font-weight: 600; }
.opmark:hover, .backlink:hover { transform: translateY(-50%) scale(1.05); filter: brightness(1.08); }

/* ============================ live bar ============================ */
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 14px 14px 18px; margin-bottom: 16px;
  background: var(--strip-bg); border: var(--strip-border); border-radius: var(--strip-radius); box-shadow: var(--strip-shadow);
  color: var(--strip-ink); animation: dcBar .6s cubic-bezier(.34,1.56,.64,1) .18s both; }
.bar-icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: var(--strip-icon-bg);
  display: flex; align-items: center; justify-content: center; color: var(--strip-accent); }
.bar-id { display: flex; flex-direction: column; gap: 3px; min-width: 150px; }
.kicker { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: .2em;
  color: var(--live); text-transform: uppercase; }
.livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: dcDot 1.5s ease-in-out infinite; }
.bar-game { font-family: var(--font-display); font-size: 20px; color: var(--strip-ink); }
.bar-scores { flex: 1 1 260px; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.bar-score { display: flex; flex-direction: column; gap: 1px; padding: 0 13px; }
.bar-score + .bar-score { border-left: 1px solid var(--strip-hair); }
.bar-score b { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--strip-muted); }
.bar-score i { font-family: var(--font-display); font-style: normal; font-size: 21px; line-height: 1.1; color: var(--strip-ink); }
.bar-score.lead b, .bar-score.lead i { color: var(--strip-accent); }
.bar-score.lead i { animation: dcReel 5s ease-in-out infinite; }

.btn-resume { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 9px;
  min-height: 52px; padding: 0 24px; border-radius: var(--resume-radius); background: var(--resume-bg);
  color: var(--resume-ink); border: var(--resume-border); box-shadow: var(--resume-shadow);
  font-family: var(--font-display); font-size: 15px;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.btn-resume:hover { transform: scale(1.05); }
.btn-resume::after { content: ""; position: absolute; top: 0; left: 0; width: 32%; height: 100%; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.6), rgba(255,255,255,0));
  animation: dcSweep 3.1s ease-in-out infinite; }

/* more than one table can be running at once */
.livewrap { margin-bottom: 16px; }
.livehead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
  animation: dcFade .5s ease .2s both; }
.livecount { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px;
  background: var(--ground-plate); color: var(--ground-ink);
  font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.livestack { display: flex; flex-direction: column; gap: 10px; }
.livestack .bar { margin-bottom: 0; }
.livewrap:not(.open) .bar.extra { display: none; }

/* ============================ tiles ============================ */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.tile { display: flex; flex-direction: column; overflow: hidden; text-align: left;
  background: var(--tile-bg); border-radius: var(--tile-radius); box-shadow: var(--tile-shadow);
  animation: dcPop .66s cubic-bezier(.34,1.56,.64,1) both;
  transition: transform .26s cubic-bezier(.34,1.56,.64,1), box-shadow .26s ease, background .24s ease, border-color .24s ease; }
.tile:nth-of-type(1){animation-delay:.30s} .tile:nth-of-type(2){animation-delay:.38s}
.tile:nth-of-type(3){animation-delay:.46s} .tile:nth-of-type(4){animation-delay:.54s}
.tile:hover { transform: translateY(-9px); box-shadow: var(--tile-hover); }
.tile1{border:var(--frame1)} .tile2{border:var(--frame2)} .tile3{border:var(--frame3)} .tile4{border:var(--frame4)}
.art { position: relative; overflow: hidden; height: 300px; }
.art1{background:var(--art1)} .art2{background:var(--art2)} .art3{background:var(--art3)} .art4{background:var(--art4)}
.artin { position: absolute; inset: 0; transition: transform .34s cubic-bezier(.34,1.56,.64,1); }
.tile:hover .artin { transform: scale(1.06); }
.art::after { content:""; position: absolute; inset: -20%; pointer-events: none; transform: translateX(-130%);
  background: linear-gradient(112deg, transparent 34%, rgba(255,255,255,.32) 50%, transparent 66%); }
.tile:hover .art::after { animation: dcSheen .85s ease; }
.tile:hover .spademark { animation: dcPulse .62s ease; }
.tile:hover .kcsuit { animation: dcSuitSpin .8s ease; }
.pill { position: absolute; top: 10px; z-index: 2; font-size: 10px; font-weight: 800; letter-spacing: .12em;
  padding: 5px 9px; border-radius: 999px; }
.pill-meta { left: 10px; color: var(--art-meta); background: var(--art-meta-bg); }
.pill-live { right: 10px; color: var(--on-live); background: var(--live); }
.band { min-height: 50px; padding: 6px 10px; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--font-display); letter-spacing: var(--band-track); font-size: 18px;
  transition: filter .24s ease, letter-spacing .24s ease, background .24s ease, color .24s ease; }
.band1{background:var(--band1);color:var(--bink1)} .band2{background:var(--band2);color:var(--bink2)}
.band3{background:var(--band3);color:var(--bink3)} .band4{background:var(--band4);color:var(--bink4)}
.tile:hover .band { filter: brightness(1.12); letter-spacing: .09em; }
.soonplus { animation: dcSoon 2.6s ease-in-out infinite; }

.prompt { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 16px 0 20px;
  animation: dcFade .5s ease .62s both; }
.prompt div:first-child { font-size: 11px; font-weight: 700; letter-spacing: .24em; color: var(--ground-ink);
  text-transform: uppercase; text-align: center; background: var(--ground-plate); padding: 9px 18px; border-radius: 999px; }
.dots { display: flex; gap: 7px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--dot-idle); }
.dots span:first-child { background: var(--acc1); animation: dcTwinkle 2.4s ease-in-out infinite; }

/* ============================ panels ============================ */
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.panel { background: var(--panel); border: var(--panel-border); border-radius: var(--panel-radius);
  box-shadow: var(--panel-shadow); padding: 14px 16px; animation: dcFade .55s ease .68s both; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  padding: 0 8px 8px; border-bottom: 1px solid var(--hair); margin-bottom: 6px; }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 400; color: var(--ink); }
.panel-head span { font-size: 9px; font-weight: 700; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
/* a 9px link is a 10px-tall tap target — pad it out to something a thumb can
   actually hit without changing how it reads */
.panel-head a { display: inline-block; padding: 8px 6px; margin: -8px -6px; }
.row { display: flex; align-items: center; gap: 11px; padding: 8px 9px; border-radius: 8px;
  transition: background .18s ease, transform .18s ease; }
.row:hover { background: var(--row-hover); transform: translateX(3px); }
.rank { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: var(--rank-bg); color: var(--muted);
  font-family: var(--font-display); font-size: 11px; display: flex; align-items: center; justify-content: center; }
.rank.top { background: var(--acc1); color: var(--on-acc1); }
.grow { flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-family: var(--font-display); font-size: 15px; }
.dim { color: var(--muted); font-size: 13px; }
.empty { padding: 26px 12px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }

/* ============================ generic controls ============================ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px;
  border-radius: 10px; font-family: var(--font-display); font-size: 14px; background: var(--rank-bg); color: var(--ink);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), filter .18s ease; }
.btn:hover { transform: translateY(-2px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.small { min-height: 38px; padding: 0 15px; font-size: 13px; }
.btn-primary { background: var(--resume-bg); color: var(--resume-ink); border: var(--resume-border); box-shadow: var(--resume-shadow);
  border-radius: var(--resume-radius); }
.btn-ghost { background: transparent; border: 1px solid var(--hair); color: var(--muted); }
.btn-danger { background: transparent; border: 1px solid var(--live); color: var(--live); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.input { min-height: 46px; padding: 0 14px; border-radius: 10px; background: var(--rank-bg); color: var(--ink);
  border: 1px solid var(--hair); width: 100%; }
.input:focus { outline: 2px solid var(--acc1); outline-offset: 1px; }
.pagehead { background: var(--ground-plate); border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; }
h1.title { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 400; color: var(--ground-ink); }
p.sub { margin: 4px 0 0; color: var(--ground-muted); font-size: 13px; }
.panel h1.title, .panel p.sub { color: var(--ink); }
.panel p.sub { color: var(--muted); }
.btn-nav { background: var(--ground-plate); color: var(--ground-ink); border: none; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.chipsel { display: flex; flex-wrap: wrap; gap: 10px; }
.chipsel button { min-height: 46px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--hair);
  background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; }
.chipsel button[aria-pressed="true"] { border-color: var(--acc1); background: var(--row-hover); }

/* ============================ scoresheet ============================ */
.sheetwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.sheet { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 340px; }
.sheet th, .sheet td { padding: 7px 8px; text-align: right; white-space: nowrap; }
.sheet th:first-child, .sheet td:first-child { text-align: left; position: sticky; left: 0;
  background: var(--rank-bg); border-right: 1px solid var(--hair); z-index: 1;
  width: 118px; padding-left: 10px; border-radius: 7px 0 0 7px; }
.sheet thead th { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--hair); }
.sheet tbody td { border-bottom: 1px solid var(--hair); }
.sheet tfoot td { padding-top: 12px; font-family: var(--font-display); font-size: 19px; }
.sheet tfoot td.lead { color: var(--acc1-text); }
.sheet tbody tr.pending td { opacity: .55; }
.cell { width: 68px; min-height: 42px; padding: 0 8px; text-align: right; border-radius: 8px; border: 1px solid var(--hair);
  background: var(--rank-bg); color: var(--ink); font-family: var(--font-display); font-size: 16px; }
.cell:focus { outline: 2px solid var(--acc1); outline-offset: 1px; }
.rnum { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.togo { font-size: 11px; color: var(--muted); }
.banner-win { margin-top: 14px; padding: 14px 16px; border-radius: 10px; background: var(--row-hover);
  border: 1px solid var(--acc1); font-size: 14px; }

/* a game with two names turns them over, one at a time */
.gname { display: grid; perspective: 500px; }
.gname i { grid-area: 1 / 1; font-style: normal; backface-visibility: hidden;
  /* `both` matters: without it the delayed name sits fully visible until its
     first turn, and the two overlap for the opening seconds */
  animation: dcName 9s cubic-bezier(.22,1,.36,1) infinite both; }
.gname i:nth-child(2) { animation-delay: 4.5s; opacity: 0; }
/* the running animation overrides that resting value; if animation is frozen
   (a screenshot tool, a print) the second name stays hidden instead of
   stacking on top of the first */

/* slot four: two library views sharing one frame */
.tilesplit { display: flex; flex-direction: column; }
.tilesplit .half { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0;
  text-align: left; transition: filter .22s ease; }
.tilesplit .half + .half { border-top: 1px solid var(--hair); }
.tilesplit .half:hover { filter: brightness(1.1); }
.tilesplit .halfart { flex: 1 1 0; height: auto; min-height: 0; }
.tilesplit .band { min-height: 42px; font-size: 16px; }

/* the two library views share a tab strip, so neither is a dead end */
.tabs { display: flex; gap: 8px; margin-bottom: 14px; padding: 5px; border-radius: 999px;
  background: var(--ground-plate); width: fit-content;
  animation: dcRise .5s cubic-bezier(.34,1.56,.64,1) both; }
.tab { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 20px;
  border-radius: 999px; color: var(--ground-ink); font-family: var(--font-display); font-size: 14px;
  transition: background .2s ease, color .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1); }
.tab:hover { transform: translateY(-2px); }
.tab.on { background: var(--acc1); color: var(--on-acc1); }

/* ============================ admin ============================ */
.flagrow { display: flex; align-items: center; gap: 16px; padding: 15px 17px;
  border-bottom: 1px solid var(--hair); }
.flagrow:last-child { border-bottom: none; }
.flagrow.off { opacity: .5; }
.flagtext { display: flex; flex-direction: column; gap: 3px; }
.flagtext b { font-size: 14.5px; font-weight: 600; }
.flagtext i { font-style: normal; font-size: 12.5px; color: var(--muted); }
.switch { flex-shrink: 0; margin-left: auto; width: 52px; height: 31px; border-radius: 999px;
  background: var(--rank-bg); border: 1px solid var(--hair); position: relative;
  transition: background .22s ease, border-color .22s ease; }
.switch span { position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%;
  background: var(--card-face); box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .22s cubic-bezier(.34,1.56,.64,1); }
.switch[aria-checked="true"] { background: var(--acc2); border-color: var(--acc2); }
.switch[aria-checked="true"] span { transform: translateX(21px); }
.switch:disabled { cursor: not-allowed; }
.pinpad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-content: center; }
.pinpad button { height: 56px; border-radius: 12px; background: var(--rank-bg); color: var(--ink);
  font-family: var(--font-display); font-size: 19px;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .18s ease; }
.pinpad button:hover { transform: translateY(-2px); background: var(--row-hover); }
.pinpad button:active { transform: scale(.94); }
.pinpad .okkey { background: var(--resume-bg); color: var(--resume-ink); font-size: 15px; }
.pinpad .clrkey { color: var(--muted); font-size: 14px; }
/* dots appear as characters are typed — the pad never advertises the length */
.pindots { display: flex; gap: 12px; justify-content: center; min-height: 15px;
  align-items: center; margin: 10px 0 4px; }
.pindots span { width: 13px; height: 13px; border-radius: 50%; background: var(--acc1);
  animation: dcPop .3s cubic-bezier(.34,1.56,.64,1) both; }
.pindots.shake { animation: dcShake .4s ease; }
.pinerr { min-height: 18px; color: var(--live); margin: 0 0 12px; }
.themegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 14px; }
.themecard { padding: 12px; border-radius: var(--panel-radius); background: var(--panel); box-shadow: var(--panel-shadow);
  border: 2px solid transparent; text-align: left; width: 100%; }
.themecard[aria-pressed="true"] { border-color: var(--acc1); }
.mini { height: 112px; border-radius: 10px; overflow: hidden; padding: 9px; display: flex; flex-direction: column; gap: 6px;
  background-color: var(--bg); background-image: var(--bg-image); }
.mini-plaque { height: 20px; width: 108px; margin: 0 auto; background: var(--plaque-bg); border: var(--plaque-border); }
.mini-bar { height: 16px; border-radius: 4px; background: var(--strip-bg); border: var(--strip-border); }
.mini-tiles { flex-grow: 1; display: flex; gap: 5px; }
.mini-tiles i { flex-grow: 1; border-radius: 3px; }
.badge { font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 5px 10px;
  border-radius: 999px; background: var(--rank-bg); color: var(--muted); }
.badge.active { background: var(--acc1); color: var(--on-acc1); }

/* ============================ responsive ============================ */
@media (max-width: 860px) {
  .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid2, .themegrid { grid-template-columns: minmax(0,1fr); }
  .art { height: 236px; }
  .bar-scores { justify-content: flex-start; }
  .btn-resume { flex: 1 1 100%; justify-content: center; }
}
@media (max-width: 520px) {
  .wrap { padding: 16px 12px 34px; }
  .art { height: 196px; }
  .band { font-size: 15px; min-height: 44px; }
  .head { height: 74px; }
  .pshape { height: 70px; width: 330px; }
  .wordmark { font-size: calc(var(--word-size) * .58); }
  .opmark span { display: none; }
}

/* ============================ 3 of Spade ============================ */
.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }

.lockedgame { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 16px; border-radius: 12px; background: var(--panel); border: var(--panel-border);
  box-shadow: var(--panel-shadow); }
.lockedmark { display: inline-flex; width: 34px; height: 34px; border-radius: 50%;
  background: var(--rank-bg); color: var(--acc1-text); align-items: center; justify-content: center; }
.lockedname { font-family: var(--font-display); font-size: 20px; }
.lockedtag { margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); }

.hand { padding: 14px 4px; border-top: 1px solid var(--hair); }
.hand:first-of-type { border-top: none; }
.hand.pending { opacity: .96; }
.hand-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hand-no { font-family: var(--font-display); font-size: 12px; color: var(--muted);
  background: var(--rank-bg); border-radius: 6px; padding: 3px 8px; }
.hand-bid { font-size: 14.5px; }
.hand-bid b { font-weight: 700; }
.hand-sir { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.suitmark { font-size: 15px; line-height: 1; color: var(--ink); }
.suitmark.red { color: var(--live); }
.badge-pend { margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
  background: var(--rank-bg); color: var(--muted); }
.badge-res { margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; padding: 4px 9px; border-radius: 999px; color: #fff; }
.badge-res.won { background: var(--acc2); }
.badge-res.lost { background: var(--live); color: var(--on-live); }

.hand-calls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
.callpair { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px;
  border-radius: 999px; background: var(--rank-bg); }
.cardchip { display: inline-flex; align-items: center; justify-content: center; min-width: 34px;
  height: 26px; padding: 0 6px; border-radius: 6px; background: var(--card-face); color: var(--suit-dark);
  font-family: var(--font-display); font-size: 13px; }
.cardchip.red { color: var(--suit-red); }
.callto { font-size: 12.5px; color: var(--muted); }

.hand-pts { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.ptcell { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px;
  border-radius: 8px; background: var(--rank-bg); }
.ptcell b { font-size: 12px; font-weight: 600; color: var(--muted); }
.ptcell i { font-style: normal; font-family: var(--font-display); font-size: 14px; }
.ptcell.won { background: var(--row-hover); }
.ptcell.won i { color: var(--acc1-text); }

.formpanel { margin-top: 14px; }
.chipsel button.redsuit { color: var(--live); }
.holdersel { gap: 8px; }

@media (max-width: 520px) {
  .lockedtag { margin-left: 0; width: 100%; }
}

/* ============================ the desk ============================ */
/* Game screens run wider than the home floor — the console needs the room. */
.wrap.wide { max-width: 1520px; }

.deskhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 12px 16px; margin-bottom: 14px; border-radius: 14px; background: var(--ground-plate);
  animation: dcRise .5s cubic-bezier(.34,1.56,.64,1) both; }
.deskhead h1 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 400;
  color: var(--ground-ink); line-height: 1.1; }
.deskmeta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.mchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
  background: var(--rank-bg); color: var(--ink); font-size: 11.5px; font-weight: 700;
  letter-spacing: .04em; white-space: nowrap; }
.mchip.livechip { background: var(--live); color: var(--on-live); }
.deskacts { margin-left: auto; display: flex; gap: 9px; flex-wrap: wrap; }

.desk { display: grid; grid-template-columns: 322px minmax(0,1fr); gap: 14px; align-items: start; }
.rail { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }
.deskmain { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* ---------------- podium: the live standing, and the reveal stage ------------- */
.podwrap { background: var(--panel); border: var(--panel-border); border-radius: var(--panel-radius);
  box-shadow: var(--panel-shadow); padding: 12px 13px 14px;
  animation: dcRise .55s cubic-bezier(.34,1.56,.64,1) .06s both; }
.podium { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pod { position: relative; display: grid; grid-template-columns: 30px minmax(0,1fr) auto; align-items: center;
  gap: 11px; padding: 11px 13px; border-radius: 13px; background: var(--rank-bg);
  border: 2px solid transparent; will-change: transform;
  transition: background .28s ease, border-color .28s ease, box-shadow .28s ease; }
.pod .podrank { width: 26px; height: 26px; border-radius: 50%; background: var(--panel); color: var(--muted);
  font-family: var(--font-display); font-size: 12px; display: flex; align-items: center; justify-content: center;
  transition: background .28s ease, color .28s ease, transform .28s cubic-bezier(.34,1.56,.64,1); }
.podname { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.podscore { font-family: var(--font-display); font-size: 25px; line-height: 1; letter-spacing: .01em;
  transition: font-size .3s cubic-bezier(.34,1.56,.64,1), color .28s ease; }
.pod.first { background: var(--row-hover); border-color: var(--acc1); }
.pod.first .podrank { background: var(--acc1); color: var(--on-acc1); }
.pod.first .podscore { color: var(--acc1-text); font-size: 30px; }
.pod.mover { z-index: 4; box-shadow: 0 14px 30px rgba(0,0,0,.30); transform-origin: 50% 50%; }
.podcrown { position: absolute; left: 6px; top: -13px; color: var(--acc1); opacity: 0;
  transform: scale(.3) rotate(-40deg); pointer-events: none; }
.pod.crowned .podcrown { animation: dcCrownIn .8s cubic-bezier(.34,1.56,.64,1) forwards; }
.pod.crowned { animation: dcThrone .9s cubic-bezier(.34,1.56,.64,1); }
.podshock { position: absolute; inset: 0; border-radius: 13px; border: 2px solid var(--acc1);
  opacity: 0; pointer-events: none; }
.pod.crowned .podshock { animation: dcShock 1s ease-out .08s 2; }
.poddelta { position: absolute; right: 14px; top: 4px; font-family: var(--font-display); font-size: 15px;
  color: var(--acc2); opacity: 0; pointer-events: none; }
.poddelta.up { animation: dcDelta 1.25s cubic-bezier(.22,1,.36,1) forwards; }
.podfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 11.5px; color: var(--muted); }

/* ---------------- the entry console ------------- */
.console { background: var(--panel); border: var(--panel-border); border-radius: var(--panel-radius);
  box-shadow: var(--panel-shadow); overflow: hidden;
  animation: dcRise .55s cubic-bezier(.34,1.56,.64,1) .1s both; }
.console-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--hair); background: var(--rank-bg); }
.console-head h2 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 400; color: var(--ink); }
.console-head .tag { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); }
.console-head .tag.hot { color: var(--live); }

.step { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 16px; align-items: start;
  padding: 13px 16px; border-bottom: 1px solid var(--hair); }
.step:last-of-type { border-bottom: none; }
.steplab { display: flex; align-items: center; gap: 9px; padding-top: 9px; }
.stepno { width: 23px; height: 23px; flex-shrink: 0; border-radius: 50%; background: var(--rank-bg);
  color: var(--muted); font-family: var(--font-display); font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  transition: background .24s ease, color .24s ease, transform .24s cubic-bezier(.34,1.56,.64,1); }
.step.done .stepno { background: var(--acc2); color: var(--panel-ink, #fff); transform: scale(1.08); }
.steplab b { font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  color: var(--muted); line-height: 1.35; }
.copyno { display: block; margin-top: 5px; font-style: normal; font-size: 9.5px;
  font-weight: 700; letter-spacing: .1em; color: var(--acc1-text); }
.stepbody { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
/* One row, every name visible, ending exactly where the card racks end:
   the callrow reserves 74px for the card face plus its 12px gap. */
.rack { display: grid; gap: 8px; align-items: center; padding-right: 86px; }
.rack > .pick { min-height: 54px; padding: 0 10px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.rack.rk-lg > .pick { font-size: 18px; }
.rack.rk-md > .pick { font-size: 16px; }
.rack.rk-sm > .pick { font-size: 14px; }
.rack.rk-xs > .pick { font-size: 12.5px; padding: 0 6px; }
/* the sir chips keep their type size and simply grow to fill the row */
.rack.sirrack > .pick { font-size: 14.5px; }
.stepbody .hint { width: 100%; margin: 2px 0 0; }

/* one tap, one value — every choice on this screen is a chip, never a dropdown */
.pick { min-height: 42px; padding: 0 15px; border-radius: 999px; border: 2px solid var(--hair);
  background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; white-space: nowrap;
  transition: transform .16s cubic-bezier(.34,1.56,.64,1), background .18s ease, border-color .18s ease, color .18s ease; }
.pick:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--acc1); }
.pick:active:not(:disabled) { transform: translateY(0) scale(.96); }
.pick[aria-pressed="true"] { background: var(--acc1); border-color: var(--acc1); color: var(--on-acc1); }
.pick:disabled { opacity: .26; cursor: not-allowed; }
.pick.sq { min-width: 44px; padding: 0 9px; border-radius: 11px; font-family: var(--font-display); font-size: 16px; }
/* card-white edges, so the suit chips read as cards rather than as buttons */
.pick.suitpick { display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-width: 54px; font-size: 14.5px; font-weight: 700; letter-spacing: .03em;
  border-color: var(--suit-edge); }
.pick.suitpick .sglyph { font-size: 26px; line-height: 1; }
.pick.suitpick .sname { white-space: nowrap; }
.pick.suitpick.red { color: var(--suit-red); }
.pick.suitpick.red[aria-pressed="true"] { background: var(--live); border-color: var(--live); color: var(--on-live); }
.pick.small { min-height: 36px; padding: 0 12px; font-size: 13px; }

.bidbox { display: flex; align-items: center; gap: 9px; margin-right: 18px; }
.stepbtn { width: 46px; height: 46px; border-radius: 13px; background: var(--rank-bg); color: var(--ink);
  font-family: var(--font-display); font-size: 17px;
  transition: transform .16s cubic-bezier(.34,1.56,.64,1), background .18s ease; }
.stepbtn:hover { transform: scale(1.09); background: var(--row-hover); }
.stepbtn:active { transform: scale(.94); }
.bidnum { width: 116px; height: 46px; text-align: center; border-radius: 13px; border: 2px solid var(--hair);
  background: var(--rank-bg); color: var(--ink); font-family: var(--font-display); font-size: 23px; }
.bidnum:focus { outline: none; border-color: var(--acc1); }
.bidcap { font-size: 11.5px; color: var(--muted); }

.callrow { display: grid; grid-template-columns: 78px minmax(0,1fr) 74px; gap: 12px; align-items: center;
  padding: 11px 0; border-top: 1px dashed var(--hair); }
.callrow:first-child { border-top: none; padding-top: 2px; }
.callno { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--acc1-text); text-align: center; padding: 9px 4px;
  border: 2px solid var(--acc1); border-radius: 10px; background: var(--row-hover); }
.callpick { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.prow { display: grid; grid-template-columns: repeat(13, minmax(0,1fr)); gap: 6px; }
.prow > .pick { min-height: 48px; }
/* the four suits span the same width as the rack above them, A through 2 */
.prow.suits { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px;
  padding-top: 8px; border-top: 1px dashed var(--hair); }
.prow.suits > .pick { min-height: 54px; }
.callface { justify-self: end; display: flex; align-items: center; justify-content: center;
  width: 72px; height: 92px; border-radius: 11px; background: var(--card-face); color: var(--suit-dark);
  border: 1px solid var(--hair); font-family: var(--font-display); font-size: 26px;
  box-shadow: 0 4px 0 rgba(0,0,0,.22);
  backface-visibility: hidden; }
.callface.red { color: var(--suit-red); }
.callface.flip { animation: dcFlip .42s cubic-bezier(.22,1,.36,1); }

.saverow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 13px 16px;
  background: var(--rank-bg); border-top: 1px solid var(--hair); }
.saverow .grow { flex-grow: 1; }
.readout { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.readout b { color: var(--ink); font-weight: 700; }

.winrow { display: flex; gap: 12px; flex-wrap: wrap; }
.winbtn { position: relative; overflow: hidden; flex: 1 1 220px; min-height: 62px; border-radius: 14px;
  font-family: var(--font-display); font-size: 16px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; color: #fff;
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), filter .18s ease; }
.winbtn small { font-family: var(--font-body); font-size: 11px; font-weight: 600; opacity: .85; letter-spacing: .04em; }
.winbtn:hover { transform: translateY(-3px) scale(1.01); filter: brightness(1.06); }
.winbtn:active { transform: scale(.98); }
.winbtn.bid { background: var(--acc2); }
.winbtn.opp { background: var(--live); color: var(--on-live); }
.winbtn::after { content: ""; position: absolute; top: 0; left: 0; width: 30%; height: 100%; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0));
  animation: dcSweep 3.4s ease-in-out infinite; }

/* ---------------- the ledger of played rounds ------------- */
.ledger { background: var(--panel); border: var(--panel-border); border-radius: var(--panel-radius);
  box-shadow: var(--panel-shadow); overflow: hidden;
  animation: dcRise .55s cubic-bezier(.34,1.56,.64,1) .16s both; }
.lrow { display: grid; grid-template-columns: 42px 168px minmax(0,1fr) auto; gap: 13px; align-items: center;
  padding: 11px 15px; border-top: 1px solid var(--hair);
  transition: background .18s ease, transform .18s ease; }
.lrow:hover { background: var(--row-hover); }
.lrow.pending { background: var(--row-hover); }
.lrow.dealt { animation: dcDeal .5s cubic-bezier(.34,1.56,.64,1) both; }
.lno { font-family: var(--font-display); font-size: 12px; color: var(--muted); background: var(--rank-bg);
  border-radius: 7px; padding: 5px 0; text-align: center; }
.lbid { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lbid b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbid span { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.lcards { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; min-width: 0; }
.lcall { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px;
  background: var(--rank-bg); }
.lcard { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 25px;
  padding: 0 6px; border-radius: 6px; background: var(--card-face); color: var(--suit-dark);
  border: 1px solid var(--hair); font-family: var(--font-display); font-size: 12.5px;
  backface-visibility: hidden; }
.lcard.red { color: var(--suit-red); }
.lcard.flip { animation: dcFlip .5s cubic-bezier(.22,1,.36,1) both; }
.lheld { font-size: 12px; color: var(--muted); }
.lheld.named { color: var(--ink); font-weight: 600; }
.lpts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.ptcell { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 10px; border-radius: 8px;
  background: var(--rank-bg); }
.ptcell b { font-size: 11.5px; font-weight: 600; color: var(--muted); }
.ptcell i { font-style: normal; font-family: var(--font-display); font-size: 14px; }
.ptcell.won { background: var(--row-hover); }
.ptcell.won i { color: var(--acc1-text); }
.lstamp { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  padding: 5px 10px; border-radius: 999px; color: #fff; white-space: nowrap; }
.lstamp.won { background: var(--acc2); }
.lstamp.lost { background: var(--live); color: var(--on-live); }
.lstamp.wait { background: var(--rank-bg); color: var(--muted); }
.lstamp.stamped { animation: dcStamp .6s cubic-bezier(.34,1.56,.64,1) both; }

/* ---------------- the wide scoresheet ------------- */
.sheetpanel { background: var(--panel); border: var(--panel-border); border-radius: var(--panel-radius);
  box-shadow: var(--panel-shadow); padding: 13px 15px 15px;
  animation: dcRise .55s cubic-bezier(.34,1.56,.64,1) .12s both; }
.sheet td.lead { color: var(--acc1-text); }
.sheet tbody tr { transition: background .18s ease; }
.sheet tbody tr:hover { background: var(--row-hover); }

/* ---------------- new-session setup ------------- */
.setup { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.06fr); gap: 14px; align-items: stretch; }
.setpanel { display: flex; flex-direction: column; }
.setbody { flex: 1 1 auto; }
.setpanel { background: var(--panel); border: var(--panel-border); border-radius: var(--panel-radius);
  box-shadow: var(--panel-shadow); padding: 0; overflow: hidden;
  animation: dcRise .55s cubic-bezier(.34,1.56,.64,1) both; }
.setpanel + .setpanel { margin-top: 14px; }
.setgrid { display: flex; flex-wrap: wrap; gap: 9px; }

/* the reveal locks the board while it plays; a tap anywhere skips to the end */
body.revealing .console, body.revealing .deskacts { pointer-events: none; }
body.revealing .skiphint { opacity: 1; }
.skiphint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 40;
  padding: 8px 16px; border-radius: 999px; background: var(--ground-plate); color: var(--ground-ink);
  font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.burst { position: fixed; width: 9px; height: 13px; border-radius: 2px; z-index: 45; pointer-events: none;
  animation: dcBurst .95s cubic-bezier(.22,1,.36,1) forwards; }

@media (max-width: 1080px) {
  .desk { grid-template-columns: minmax(0,1fr); }
  .rail { position: static; }
  .setup { grid-template-columns: minmax(0,1fr); }
  .lrow { grid-template-columns: 40px minmax(0,1fr); row-gap: 9px; }
  .lrow .lcards, .lrow .lpts { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (max-width: 760px) { .prow { grid-template-columns: repeat(7, minmax(0,1fr)); } }
@media (max-width: 430px) { .prow { grid-template-columns: repeat(5, minmax(0,1fr)); } }
@media (max-width: 860px) {
  /* no room to line up with anything — let the chips wrap instead of
     squeezing names down to nothing */
  .rack { display: flex; flex-wrap: wrap; padding-right: 0; }
  .rack > .pick { flex: 1 1 auto; font-size: 15px; }
  .rack.sirrack > .pick { flex: 1 1 44%; }
}
@media (max-width: 620px) {
  .step { grid-template-columns: minmax(0,1fr); gap: 8px; padding: 12px 13px; }
  .steplab { padding-top: 0; }
  .callrow { grid-template-columns: minmax(0,1fr) 80px; }
  .callno { grid-column: 1 / -1; }
  /* four named suits will not fit across a phone — stack them two by two */
  .prow.suits { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .deskacts { margin-left: 0; width: 100%; }
  .pick { min-height: 40px; padding: 0 13px; }
  .pick.sq { min-width: 40px; }
}

/* ============================ motion ============================ */
@keyframes dcPlaque { from { opacity:0; transform: translateY(-22px) scale(.96);} to { opacity:1; transform:none; } }
@keyframes dcRule { from { transform: scaleX(0);} to { transform: scaleX(1);} }
@keyframes dcBar { from { opacity:0; transform: translateY(-18px);} to { opacity:1; transform:none;} }
@keyframes dcPop { from { opacity:0; transform: translateY(28px) scale(.94);} to { opacity:1; transform:none;} }
@keyframes dcFade { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:none;} }
@keyframes dcDot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.55);opacity:.35} }
@keyframes dcSweep { 0%{transform:translateX(-150%) skewX(-20deg)} 55%,100%{transform:translateX(430%) skewX(-20deg)} }
@keyframes dcSheen { from{transform:translateX(-130%)} to{transform:translateX(130%)} }
@keyframes dcBulb { 0%,100%{opacity:.92;box-shadow:0 0 6px var(--bulb-glow)} 50%{opacity:.42;box-shadow:0 0 0 rgba(0,0,0,0)} }
@keyframes dcReel { 0%,84%,100%{transform:translateY(0)} 88%{transform:translateY(-9px)} 94%{transform:translateY(5px)} }
@keyframes dcPulse { 0%,100%{transform:scale(1)} 45%{transform:scale(1.16) rotate(-4deg)} }
@keyframes dcSuitSpin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes dcSoon { 0%,100%{opacity:.55;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
@keyframes dcTwinkle { 0%,100%{opacity:.3;transform:scale(.72)} 50%{opacity:1;transform:scale(1)} }
@keyframes dcFlicker { 0%,15%,19%,47%,51%,100%{opacity:1} 17%,49%{opacity:.45} }
@keyframes dcConf { 0%{transform:translateY(-30px) rotate(0);opacity:0} 14%{opacity:.5} 100%{transform:translateY(1400px) rotate(420deg);opacity:0} }
@keyframes dcShimmer { 0%,100%{opacity:.28;transform:translateX(-4%)} 50%{opacity:.55;transform:translateX(4%)} }
@keyframes dcRise { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
@keyframes dcDeal { from{opacity:0;transform:translateY(-18px) rotate(-1.6deg) scale(.97)} to{opacity:1;transform:none} }
@keyframes dcFlip { 0%{transform:rotateY(0) scale(1)} 45%{transform:rotateY(90deg) scale(1.18)} 100%{transform:rotateY(0) scale(1)} }
@keyframes dcStamp { 0%{opacity:0;transform:scale(2.6) rotate(-15deg)} 55%{opacity:1;transform:scale(.9) rotate(3deg)} 100%{opacity:1;transform:none} }
@keyframes dcDelta { 0%{opacity:0;transform:translateY(8px) scale(.6)} 22%{opacity:1;transform:translateY(-2px) scale(1.15)}
  70%{opacity:1;transform:translateY(-12px) scale(1)} 100%{opacity:0;transform:translateY(-26px) scale(.9)} }
@keyframes dcCrownIn { 0%{opacity:0;transform:scale(.3) rotate(-45deg) translateY(14px)}
  60%{opacity:1;transform:scale(1.3) rotate(9deg) translateY(-2px)} 100%{opacity:1;transform:scale(1) rotate(-6deg)} }
@keyframes dcShock { 0%{opacity:.85;transform:scale(1)} 100%{opacity:0;transform:scale(1.3)} }
@keyframes dcThrone { 0%{transform:scale(1)} 30%{transform:scale(1.11)} 62%{transform:scale(.985)} 100%{transform:scale(1)} }
@keyframes dcName { 0%{opacity:0;transform:rotateX(-92deg)} 4%{opacity:1;transform:rotateX(0)}
  46%{opacity:1;transform:rotateX(0)} 51%{opacity:0;transform:rotateX(92deg)}
  100%{opacity:0;transform:rotateX(92deg)} }
@keyframes dcShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  45%{transform:translateX(6px)} 70%{transform:translateX(-4px)} }
@keyframes dcBurst { 0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(var(--bx),var(--by)) rotate(420deg) scale(.35)} }
.conf { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.conf i { position: absolute; top: -30px; width: 8px; height: 12px; border-radius: 2px; animation: dcConf 9.2s linear infinite; }
.felt { position: fixed; inset: -10%; pointer-events: none; z-index: 0; animation: dcShimmer 9s ease-in-out infinite;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0px, rgba(255,255,255,.10) 3px, transparent 3px, transparent 11px); }
.bulbs { position: absolute; left: 14px; right: 14px; justify-content: space-between; pointer-events: none; }
.bulbs i { width: 6px; height: 6px; border-radius: 50%; background: var(--bulb); animation: dcBulb 2.6s ease-in-out infinite; }
.bulbs i:nth-child(2n){animation-delay:.45s} .bulbs i:nth-child(3n){animation-delay:.95s}

/* the one-shot entrance sequence plays once, on real page load — every
   .rule/.plaque/.bar/.tile/.prompt/.panel animation ends on the exact same
   opacity:1/transform:none rest state it starts from, so turning it off
   here is visually silent, it just stops the replay */
body.settled .rule, body.settled .plaque, body.settled .bar,
body.settled .tile, body.settled .prompt, body.settled .panel,
body.settled .deskhead, body.settled .podwrap, body.settled .console, body.settled .livehead,
body.settled .ledger, body.settled .sheetpanel, body.settled .setpanel {
  animation: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *, *::after { animation: none !important; transition: none !important; }
  /* the two names can no longer take turns, so show them at once */
  .gname { display: block; }
  .gname i { display: inline; }
  .gname i + i::before { content: " / "; }
}
</style>
