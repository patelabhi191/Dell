<body>
<div class="conf" id="conf" aria-hidden="true"></div>
<div class="felt" aria-hidden="true"></div>
<div class="wrap" id="app"></div>

<script>
/* ==================================================================
   Card Night — score tracker
   Single self-contained file. No build step, no dependencies.
   Open it directly, or serve it from anywhere static.
   ================================================================== */

/* ------------------------------------------------------------------
   1. CONFIG
   ------------------------------------------------------------------ */

/* Admin PIN. This gates the Admin screen against accidental changes.
   It is checked in the browser, so it is a deterrent, NOT security —
   anyone can read it by viewing source. That is proportionate here:
   anyone with the link can already edit the scores themselves. */
var ADMIN_PIN = '2468';
/* Where the PIN comes from. Once Firestore is configured the settings
   document carries it, so it can be changed without touching this file;
   until then the constant above stands in. Either way it is checked in the
   browser — a deterrent against accidental changes, not a security boundary. */
function adminPin() {
  return (state.settings && state.settings.pin) || ADMIN_PIN;
}

/* Leave null to use this device's localStorage (the default).
   To switch the whole group onto shared, live-syncing Firestore:
     1. Create a Firebase project and a Firestore database.
     2. Paste the web config object here.
     3. Add the two <script> tags noted in FirestoreStore below.
   Until then every device keeps its own copy. */
var FIREBASE_CONFIG = null;

var GAMES = [
  { id: 'spade3',    name: '3 of Spade', alt: 'Kadi Teeli', band: '3 of Spade', slot: 1, roundType: 'bid' },
  { id: 'kachufull', name: 'KaChuFull',  band: 'KaChuFull',  slot: 2, roundType: 'numeric' }
];

/* A single deck holds 250 points: (4 suits x 50 for A/K/Q/J/10) + 30 for the
   3 of Spades + 20 for the four 5s. Two decks, 500. This caps a bid. */
var DECK_POINTS = 250;

var RANKS = ['A', 'K', 'Q', 'J', '10', '9', '8', '7', '6', '5', '4', '3', '2'];
var SUITS = [
  { id: 'S', name: 'Spades',   glyph: '\u2660', red: false },
  { id: 'H', name: 'Hearts',   glyph: '\u2665', red: true  },
  { id: 'D', name: 'Diamonds', glyph: '\u2666', red: true  },
  { id: 'C', name: 'Clubs',    glyph: '\u2663', red: false }
];
function suitById(id) {
  for (var i = 0; i < SUITS.length; i++) if (SUITS[i].id === id) return SUITS[i];
  return SUITS[0];
}
function cardLabel(c) { return c ? (c.rank + suitById(c.suit).glyph) : '--'; }
function cardIsRed(c) { return c ? suitById(c.suit).red : false; }

var THEMES = [
  { id: 'terminal', label: 'Terminal Classic', note: 'Charcoal chrome, trapezoid plaque' },
  { id: 'slot',     label: 'Slot Machine',     note: 'Red carnival, marquee bulbs, confetti' },
  { id: 'neon',     label: 'Neon Terminal',    note: 'Indigo, flickering neon tube' },
  { id: 'tropical', label: 'Tropical Table',   note: 'Turquoise felt, arched plaque' },
  { id: 'glassdark',  label: 'Frosted Dark',    note: 'iOS glass over a night wallpaper' },
  { id: 'glasslight', label: 'Frosted Light',   note: 'iOS glass over a bright wallpaper' },
  { id: 'midnight',   label: 'Midnight Studio', note: 'Black ground, electric accents' },
  { id: 'daylight',   label: 'Daylight Studio', note: 'Warm white, the same accents' }
];

var STORAGE_KEY = 'cardnight:v1';

/* ------------------------------------------------------------------
   2. STORE — one interface, two implementations
   ------------------------------------------------------------------ */

var LocalStore = {
  id: 'local',
  read: function () {
    try { return JSON.parse(window.localStorage.getItem(STORAGE_KEY)) || null; }
    catch (e) { return null; }
  },
  write: function (state) {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }
};

/* ------------------------------------------------------------------
   FIRESTORE — the same read/write interface, backed by one document so
   every phone at the table sees the same scores.

   The SDK is not shipped with this file; it is pulled from Google's CDN
   the first time a connection is attempted, so an unconfigured copy of
   the app loads nothing extra and still works offline on localStorage.
   ------------------------------------------------------------------ */

var FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.5/';

/* Where the config comes from: whatever Admin saved, else the constant at
   the top of the file. Both are plain client keys — Firestore security
   rules are what actually protect the data, never these values. */
function firebaseConfig() {
  var c = (state && state.settings && state.settings.firebase) || FIREBASE_CONFIG;
  return (c && c.apiKey && c.projectId) ? c : null;
}
function firebaseName() {
  var c = (state && state.settings && state.settings.firebase) || FIREBASE_CONFIG;
  return (c && c.label) || (c && c.projectId) || '';
}

var fb = { app: null, db: null, api: null, status: 'off', detail: '' };

/* Load the modular SDK once and hand back { api, db }. */
function firebaseInit() {
  var cfg = firebaseConfig();
  if (!cfg) return Promise.reject(new Error('No Firebase configuration saved yet.'));
  if (fb.db) return Promise.resolve(fb);
  return Promise.all([
    import(FB_SDK + 'firebase-app.js'),
    import(FB_SDK + 'firebase-firestore.js')
  ]).then(function (mods) {
    var appMod = mods[0], fsMod = mods[1];
    fb.api = fsMod;
    fb.app = appMod.getApps && appMod.getApps().length ? appMod.getApp() : appMod.initializeApp({
      apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId,
      storageBucket: cfg.storageBucket, messagingSenderId: cfg.messagingSenderId, appId: cfg.appId
    });
    fb.db = fsMod.getFirestore(fb.app);
    return fb;
  });
}

/* Write a scratch document, read it back, delete it — and time the round
   trip. This is what the Admin tab's Test button runs. */
function firebaseTest() {
  var t0 = Date.now(), stamp = 'ping-' + t0;
  return firebaseInit().then(function (h) {
    var ref = h.api.doc(h.db, 'cardnight', '_conntest');
    return h.api.setDoc(ref, { stamp: stamp, at: t0 })
      .then(function () { return h.api.getDoc(ref); })
      .then(function (snap) {
        if (!snap.exists() || snap.data().stamp !== stamp) throw new Error('Wrote the test document but read back something else.');
        return h.api.deleteDoc(ref).catch(function () { /* leaving it behind is harmless */ });
      })
      .then(function () { return { ms: Date.now() - t0 }; });
  });
}

var FirestoreStore = {
  id: 'firestore',
  _ref: null,
  _cache: null,
  init: function (onRemoteChange) {
    return firebaseInit().then(function (h) {
      FirestoreStore._ref = h.api.doc(h.db, 'cardnight', 'state');
      h.api.onSnapshot(FirestoreStore._ref, function (snap) {
        FirestoreStore._cache = snap.exists() ? snap.data().state : null;
        if (onRemoteChange) onRemoteChange(FirestoreStore._cache);
      });
      return FirestoreStore;
    });
  },
  read: function () { return this._cache; },
  write: function (st) {
    if (!this._ref || !fb.api) return false;
    fb.api.setDoc(this._ref, { state: st, at: Date.now() });
    return true;
  }
};

/* Local until a connection is proven; the boot sequence promotes it. */
var Store = LocalStore;

/* ------------------------------------------------------------------
   3. STATE + MODEL
   ------------------------------------------------------------------ */

function blankState() {
  return { players: [], sessions: [], settings: { theme: 'terminal' } };
}

var state = Store.read() || blankState();
if (!state.settings) state.settings = { theme: 'terminal' };
if (!state.players) state.players = [];
if (!state.sessions) state.sessions = [];

function save() { Store.write(state); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function playerName(id) {
  for (var i = 0; i < state.players.length; i++) if (state.players[i].id === id) return state.players[i].name;
  return 'Unknown';
}
/* A game with two names shows them one at a time, each turning over like a
   card. Pure CSS on an infinite loop, so it survives every re-render and
   needs no timer of its own. */
function gameNameHtml(g) {
  if (!g.alt) return esc(g.name);
  return '<span class="gname"><i>' + esc(g.name) + '</i><i>' + esc(g.alt) + '</i></span>';
}

function gameById(id) {
  for (var i = 0; i < GAMES.length; i++) if (GAMES[i].id === id) return GAMES[i];
  return { id: id, name: id, band: id, slot: 1, roundType: 'numeric' };
}

/* Sessions stored before bid scoring existed carry no roundType; they are
   numeric, so nothing already recorded changes meaning. */
function isBid(s) { return s.roundType === 'bid'; }

/* One deck 250, two decks 500. Caps the bid. */
/* How many decks are on the table — 1, 2 or 3. It sets both the bid ceiling
   and how many copies of one card can be asked for in a round. */
function deckCount(s) {
  var n = Number(s.deckCount) || 1;
  if (n < 1) n = 1;
  if (n > 3) n = 3;
  return n;
}

function deckMax(s) { return deckCount(s) * DECK_POINTS; }

/* Who is on the bidder's side this hand, and how many shares each holds.
   The bidder holds one share for bidding; a called-card holder holds one
   share per called card they turned out to have -- so a player holding two
   of them takes twice the bid. That is the dual partner. */
function biddingShares(r) {
  var shares = {};
  if (!r.bidderId) return shares;
  shares[r.bidderId] = 1;
  (r.calls || []).forEach(function (c) {
    if (!c.holderId) return;
    shares[c.holderId] = (shares[c.holderId] || 0) + 1;
  });
  return shares;
}

/* What one hand pays each player. */
function roundPoints(s, r) {
  var out = {};
  s.playerIds.forEach(function (pid) { out[pid] = 0; });

  if (!isBid(s)) {
    s.playerIds.forEach(function (pid) { out[pid] = Number((r.scores || {})[pid]) || 0; });
    return out;
  }

  /* a hand still waiting on the partner reveal pays nothing yet */
  if (r.stage !== 'done' || !r.winner) return out;

  var shares = biddingShares(r);
  if (r.winner === 'bidding') {
    s.playerIds.forEach(function (pid) { out[pid] = (shares[pid] || 0) * r.bid; });
  } else {
    s.playerIds.forEach(function (pid) { out[pid] = shares[pid] ? 0 : r.bid; });
  }
  return out;
}

function totals(session) {
  var t = {};
  session.playerIds.forEach(function (pid) { t[pid] = 0; });
  session.rounds.forEach(function (r) {
    var rp = roundPoints(session, r);
    session.playerIds.forEach(function (pid) { t[pid] += rp[pid]; });
  });
  return t;
}

function standings(session) {
  var t = totals(session);
  return session.playerIds.map(function (pid) {
    return { id: pid, name: playerName(pid), total: t[pid] };
  }).sort(function (a, b) { return b.total - a.total; });
}

function pendingRound(s) {
  for (var i = 0; i < s.rounds.length; i++) if (s.rounds[i].stage === 'bid') return s.rounds[i];
  return null;
}

/* every table still in play, newest first */
function liveSessions() {
  return state.sessions.filter(function (s) { return s.status === 'live'; })
    .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
}

function liveSession() {
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].status === 'live') return state.sessions[i];
  return null;
}

function finishedSessions() {
  return state.sessions.filter(function (s) { return s.status === 'finished'; })
    .sort(function (a, b) { return b.finishedAt - a.finishedAt; });
}

function allTime() {
  var done = finishedSessions();
  var rows = state.players.map(function (p) {
    var played = 0, won = 0;
    done.forEach(function (s) {
      if (s.playerIds.indexOf(p.id) === -1) return;
      played++;
      if (s.winnerId === p.id) won++;
    });
    return { id: p.id, name: p.name, played: played, won: won,
             rate: played ? Math.round((won / played) * 100) : 0 };
  }).filter(function (r) { return r.played > 0; });
  rows.sort(function (a, b) { return b.rate - a.rate || b.won - a.won || b.played - a.played; });
  return rows;
}

function lastPlayed(gameId) {
  var done = state.sessions.filter(function (s) { return s.gameId === gameId; })
    .sort(function (a, b) { return (b.finishedAt || b.createdAt) - (a.finishedAt || a.createdAt); });
  if (!done.length) return 'not played yet';
  var days = Math.floor((Date.now() - (done[0].finishedAt || done[0].createdAt)) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  return days + ' days ago';
}

function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function fmtDate(ms) {
  var d = new Date(ms);
  return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
}

/* ------------------------------------------------------------------
   4. SMALL HELPERS
   ------------------------------------------------------------------ */

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
function go(hash) { location.hash = hash; }

/* ------------------------------------------------------------------
   5. ARTWORK — suits, game logos, chrome
   ------------------------------------------------------------------ */

var PATHS = {
  spade: 'M12 2.5c3 4 8.5 6.6 8.5 11a4.6 4.6 0 0 1-7.3 3.7c.2 1.6.8 3 1.8 4.3H9c1-1.3 1.6-2.7 1.8-4.3A4.6 4.6 0 0 1 3.5 13.5c0-4.4 5.5-7 8.5-11z',
  heart: 'M12 21s-7.5-4.7-9.4-9.2C1 8.3 3 4.8 6.4 4.5 8.6 4.3 10.6 5.4 12 7.2c1.4-1.8 3.4-2.9 5.6-2.7C21 4.8 23 8.3 21.4 11.8 19.5 16.3 12 21 12 21z',
  diamond: 'M12 2l7 10-7 10-7-10z',
  club: 'M12 2.6a3.7 3.7 0 0 0-3.1 5.7 3.8 3.8 0 1 0-1.3 7.3c1.2 0 2.3-.6 3-1.5-.1 2-.8 3.8-2 5.3h6.8c-1.2-1.5-1.9-3.3-2-5.3.7.9 1.8 1.5 3 1.5a3.8 3.8 0 1 0-1.3-7.3A3.7 3.7 0 0 0 12 2.6z',
  play: 'M8 5l11 7-11 7z',
  crown: 'M3 7.6l4.3 3.2L12 3.4l4.7 7.4L21 7.6 19.3 19H4.7L3 7.6z'
};
function icon(k, size, color) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + (color || 'currentColor') +
    '" aria-hidden="true"><path d="' + PATHS[k] + '"/></svg>';
}
var LINES = {
  box: '<path d="M3 6.5h18v4H3zM5 10.5V20h14v-9.5M9.5 14h5"/>',
  users: '<circle cx="9.2" cy="8.6" r="3.1"/><path d="M3.4 19.4a5.8 5.8 0 0 1 11.6 0"/>' +
         '<circle cx="17.4" cy="10.2" r="2.3"/><path d="M15.9 15.2a4.6 4.6 0 0 1 4.7 4.2"/>'
};
function lineIcon(k, size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + LINES[k] + '</svg>';
}

function lockIcon(size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg>';
}

/* Game artwork is being redrawn; the tiles show their frame and band only.
   The previous logoSpade3()/logoKachu() builders are in git history. */

function logoSoon() {
  return '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">' +
    '<div class="soonplus" style="position:relative;width:72px;height:72px;border-radius:20px;' +
      'border:3px dashed var(--ghost-line);display:flex;align-items:center;justify-content:center">' +
      '<span style="position:absolute;width:30px;height:4px;border-radius:2px;background:var(--ghost-line)"></span>' +
      '<span style="position:absolute;width:4px;height:30px;border-radius:2px;background:var(--ghost-line)"></span>' +
    '</div>' +
    '<div style="display:flex;gap:7px">' +
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--ghost-line)"></span>' +
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--ghost-line);opacity:.6"></span>' +
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--ghost-line);opacity:.3"></span>' +
    '</div>' +
    '<div style="font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--bink3);text-transform:uppercase">Game 3 &middot; 4 &middot; 5</div>' +
    '</div>';
}

/* the players mark — a stack of chips at the table, in the same flat style */
function logoChips() {
  function chip(x, y, col, pip) {
    return '<div style="position:absolute;left:' + x + 'px;top:' + y + 'px;width:74px;height:74px;border-radius:50%;' +
      'background:' + col + ';border:4px solid var(--box-line);box-shadow:var(--art-shadow);' +
      'display:flex;align-items:center;justify-content:center">' +
      '<span style="position:absolute;inset:6px;border-radius:50%;border:3px dashed var(--box-line);opacity:.45"></span>' +
      '<span style="position:relative;color:var(--box-line);display:flex">' + icon(pip, 26) + '</span></div>';
  }
  return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">' +
    '<div style="position:relative;width:170px;height:128px">' +
      chip(0, 40, 'var(--acc4)', 'club') +
      chip(48, 6, 'var(--card-face)', 'spade') +
      chip(96, 40, 'var(--acc1)', 'heart') +
    '</div></div>';
}

function logoBox() {
  return '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">' +
    '<div style="position:relative;width:158px;height:128px">' +
      '<div style="position:absolute;left:16px;top:2px;width:126px;height:24px;background:var(--card-face);border-radius:5px;' +
        'box-shadow:var(--art-shadow);transform:rotate(-5deg)"></div>' +
      '<div style="position:absolute;left:22px;top:12px;width:116px;height:22px;background:var(--card-face);border-radius:5px;' +
        'box-shadow:var(--art-shadow);transform:rotate(4deg);opacity:.85"></div>' +
      '<div style="position:absolute;left:0;top:34px;width:158px;height:30px;background:var(--acc4);border-radius:7px;' +
        'border:3px solid var(--box-line)"></div>' +
      '<div style="position:absolute;left:10px;top:64px;width:138px;height:64px;background:var(--acc4);border-radius:0 0 8px 8px;' +
        'border:3px solid var(--box-line);border-top:none;display:flex;align-items:center;justify-content:center">' +
        '<div style="width:48px;height:8px;border-radius:4px;background:var(--box-line);opacity:.5"></div></div>' +
    '</div></div>';
}

/* ------------------------------------------------------------------
   6. CHROME
   ------------------------------------------------------------------ */

function header(opts) {
  opts = opts || {};
  var bulbs = '';
  for (var i = 0; i < 13; i++) bulbs += '<i></i>';
  return '<div class="head">' +
    '<div class="rule"></div>' +
    (opts.back ? '<a class="backlink" href="#' + opts.back + '">&larr; Back</a>' : '') +
    '<div class="plaque"><div class="pshape skin">' +
      '<div class="bulbs" style="top:6px;display:none">' + bulbs + '</div>' +
      '<div class="bulbs" style="bottom:6px;display:none">' + bulbs + '</div>' +
      '<div class="wordmark">' + esc(opts.title || 'AP CARD GAMES') + '</div>' +
      '<div class="plaque-sub">' + esc(opts.sub || 'Night') + '</div>' +
    '</div></div>' +
    (opts.back ? '' : '<a class="opmark" href="#/admin">' + icon('club', 16) + '<span>ap card games</span></a>') +
  '</div>';
}

/* ------------------------------------------------------------------
   7. VIEWS
   ------------------------------------------------------------------ */

/* transient view state — never persisted */

/* one running table, as a bar. Two fit on screen; beyond that the rest
   fold away behind a count until someone asks for them. */
function liveBar(s, extra) {
  var g = gameById(s.gameId);
  var scores = standings(s).map(function (r, i) {
    return '<div class="bar-score' + (i === 0 ? ' lead' : '') + '"><b>' + esc(r.name) + '</b><i>' + r.total + '</i></div>';
  }).join('');
  return '<div class="bar skin' + (extra ? ' extra' : '') + '">' +
    '<div class="bar-icon">' + icon(s.gameId === 'spade3' ? 'spade' : 'club', 21) + '</div>' +
    '<div class="bar-id"><div class="kicker"><span class="livedot"></span>Live now &middot; ' +
      plural(s.rounds.length, 'round') + '</div>' +
    '<div class="bar-game">' + esc(g.name) + '</div></div>' +
    '<div class="bar-scores">' + scores + '</div>' +
    '<button class="btn-resume" data-go="/session/' + s.id + '">' + icon('play', 14) + ' RESUME</button>' +
    '</div>';
}

function viewHome() {
  var lives = liveSessions();
  var live = lives[0] || null;
  var html = header({});

  if (lives.length) {
    var shown = lives.slice(0, 2);
    var folded = lives.slice(2);
    html += '<div class="livewrap" id="livewrap">';
    if (lives.length > 1) {
      html += '<div class="livehead"><span class="livecount"><span class="livedot"></span>' +
        lives.length + ' tables running</span>' +
        (folded.length ? '<button class="btn btn-nav small" id="livetoggle">Show all ' +
          lives.length + '</button>' : '') + '</div>';
    }
    html += '<div class="livestack">' +
      shown.map(function (x) { return liveBar(x, false); }).join('') +
      folded.map(function (x) { return liveBar(x, true); }).join('') +
      '</div></div>';
  } else {
    html += '<div class="bar skin">' +
      '<div class="bar-icon">' + icon('spade', 21) + '</div>' +
      '<div class="bar-id"><div class="kicker" style="color:var(--strip-muted)">No game in progress</div>' +
      '<div class="bar-game">Pick a game below</div></div>' +
      '<div class="bar-scores"></div>' +
      '</div>';
  }

  var tiles = '';
  GAMES.forEach(function (g, i) {
    var n = i + 1;
    var onGame = lives.filter(function (x) { return x.gameId === g.id; }).length;
    tiles += '<button class="tile tile' + n + ' skin" data-go="/new?game=' + g.id + '">' +
      '<div class="art art' + n + '"><div class="artin"></div>' +
      '<span class="pill pill-meta">' + esc(lastPlayed(g.id)) + '</span>' +
      (onGame ? '<span class="pill pill-live">' + (onGame > 1 ? onGame + ' LIVE' : 'LIVE') + '</span>' : '') +
      '</div><div class="band band' + n + '">' + gameNameHtml(g) + '</div></button>';
  });
  tiles += '<div class="tile tile3 skin"><div class="art art3"><div class="artin">' + logoSoon() + '</div>' +
    '<span class="pill pill-meta">slot open</span></div>' +
    '<div class="band band3">More Coming Soon</div></div>';
  /* slot four carries the two library views, a half each */
  tiles += '<div class="tile tile4 skin tilesplit">' +
    '<button class="half" data-go="/archives">' +
      '<div class="art art4 halfart"><div class="artin" style="transform:scale(.56)">' + logoBox() + '</div>' +
      '<span class="pill pill-meta">' + plural(finishedSessions().length, 'session') + '</span></div>' +
      '<div class="band band4">Archives</div></button>' +
    '<button class="half" data-go="/players">' +
      '<div class="art art4 halfart"><div class="artin" style="transform:scale(.56)">' + logoChips() + '</div>' +
      '<span class="pill pill-meta">' + plural(state.players.filter(function (p) { return p.active !== false; }).length, 'player') + '</span></div>' +
      '<div class="band band4">Players</div></button>' +
  '</div>';
  html += '<div class="tiles">' + tiles + '</div>';

  html += '<div class="prompt"><div>Tap a game to start scoring</div></div>';

  var at = allTime();
  var boardRows = at.length ? at.map(function (r, i) {
    return '<div class="row"><span class="rank' + (i === 0 ? ' top' : '') + '">' + (i + 1) + '</span>' +
      '<span class="grow">' + esc(r.name) + '</span>' +
      '<span class="dim" style="width:36px;text-align:right">' + r.played + '</span>' +
      '<span style="width:32px;text-align:right;font-weight:700">' + r.won + '</span>' +
      '<span class="num" style="width:52px;text-align:right;' + (i === 0 ? 'color:var(--acc1-text)' : '') + '">' + r.rate + '%</span></div>';
  }).join('') : '<div class="empty">No finished sessions yet.<br>Standings appear once a night is played out.</div>';

  var done = finishedSessions().slice(0, 5);
  var recentRows = done.length ? done.map(function (s) {
    return '<button class="row" style="width:100%;text-align:left" data-go="/session/' + s.id + '">' +
      '<span class="grow" style="max-width:110px;font-weight:600">' + esc(gameById(s.gameId).name) + '</span>' +
      '<span class="dim" style="width:56px">' + fmtDate(s.finishedAt) + '</span>' +
      '<span class="grow" style="font-weight:700;color:var(--acc2)">' + esc(playerName(s.winnerId)) + '</span>' +
      '<span class="num">' + plural(s.rounds.length, 'round') + '</span></button>';
  }).join('') : '<div class="empty">Nothing in the archive yet.</div>';

  html += '<div class="grid2">' +
    '<section class="panel skin"><div class="panel-head"><h2>All-time standings</h2><span>played / won / rate</span></div>' + boardRows + '</section>' +
    '<section class="panel skin"><div class="panel-head"><h2>Recent results</h2><span>' +
      (done.length ? '<a href="#/archives">see all</a>' : 'see all') + '</span></div>' + recentRows + '</section>' +
    '</div>';

  if (!state.players.length) {
    html += '<div class="panel skin" style="margin-top:14px;text-align:center">' +
      '<div class="empty" style="padding-bottom:14px">Nothing here yet &mdash; this is a fresh scoreboard.<br>' +
      'Add the people who play, or drop in a sample night to see it populated.</div>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" data-go="/players">Add players</button>' +
      '<button class="btn" id="seed">Load sample night</button></div></div>';
  }
  return html;
}

function viewNew(query) {
  var gid = (query.match(/game=([a-z0-9]+)/) || [])[1];
  /* no game in the URL means nothing was chosen — send them to the tiles
     rather than silently defaulting to the first game */
  if (!gid || !GAMES.some(function (g) { return g.id === gid; })) { go('/'); return ''; }

  var g = gameById(gid);
  var active = state.players.filter(function (p) { return p.active !== false; });
  if (!active.length) {
    return header({ back: '/' }) + '<div class="pagehead"><h1 class="title">New session</h1></div>' +
      '<div class="panel skin"><div class="empty">You need players before a session can start.</div>' +
      '<div class="btn-row" style="justify-content:center"><button class="btn btn-primary" data-go="/players">Add players</button></div></div>';
  }

  var people = active.map(function (p) {
    return '<button class="pick" data-player="' + p.id + '" aria-pressed="true">' + esc(p.name) + '</button>';
  }).join('');

  var bidBits = '';
  if (g.roundType === 'bid') {
    bidBits =
      '<div class="step done"><span class="steplab"><span class="stepno">1</span><b>How many<br>decks</b></span>' +
        '<span class="stepbody" id="decksel">' +
          '<button class="pick" data-deck="1" aria-pressed="true">1 deck</button>' +
          '<button class="pick" data-deck="2" aria-pressed="false">2 decks</button>' +
          '<button class="pick" data-deck="3" aria-pressed="false">3 decks</button>' +
          '<p class="hint" id="deckhint">Bids can go up to 250.</p></span></div>' +
      '<div class="step done"><span class="steplab"><span class="stepno">2</span><b>Partners the<br>bidder calls</b></span>' +
        '<span class="stepbody" id="partsel">' +
          '<button class="pick sq" data-part="1" aria-pressed="true">1</button>' +
          '<button class="pick sq" data-part="2" aria-pressed="false">2</button>' +
          '<button class="pick sq" data-part="3" aria-pressed="false">3</button>' +
          '<button class="pick sq" data-part="4" aria-pressed="false">4</button>' +
          '<button class="pick sq" data-part="5" aria-pressed="false">5</button>' +
          '<p class="hint">One card is asked for per partner. Any deck size plays with any of these.</p></span></div>';
  }

  return header({ back: '/' }) +
    '<div class="deskhead"><h1>New session</h1>' +
      '<div class="deskmeta"><span class="mchip">' + esc(g.name) + '</span>' +
        '<span class="mchip">' + lockIcon(12) + ' locked for this session</span></div></div>' +
    '<div class="setup">' +
      '<section class="setpanel">' +
        '<div class="console-head"><h2>Who is playing</h2>' +
          '<span class="tag">tap to drop anyone sitting out</span></div>' +
        '<div class="step setbody" style="grid-template-columns:minmax(0,1fr);border-bottom:none;align-content:start">' +
          '<span class="stepbody" id="playersel">' + people + '</span></div>' +
        '<div class="saverow"><span class="readout" id="playercount">' +
            '<b>' + active.length + '</b> at the table</span><span class="grow"></span>' +
          '<button class="btn btn-ghost small" data-allplayers="1">All</button>' +
          '<button class="btn btn-ghost small" data-allplayers="0">None</button></div>' +
      '</section>' +
      '<div style="display:flex;flex-direction:column">' +
        '<section class="setpanel" style="flex:1">' +
          '<div class="console-head"><h2>The game</h2><span class="tag">fixed once you start</span></div>' +
          '<div class="lockedgame" style="border:none;box-shadow:none;background:transparent">' +
            '<span class="lockedmark">' + icon(g.id === 'spade3' ? 'spade' : 'club', 18) + '</span>' +
            '<span class="lockedname">' + esc(g.name) + '</span>' +
            '<span class="lockedtag">go Back to change it</span></div>' +
          bidBits +
          '<div class="saverow"><span class="grow"></span>' +
            '<button class="btn btn-ghost" data-go="/">Cancel</button>' +
            '<button class="btn btn-primary" id="start" data-game="' + g.id + '">Start session</button></div>' +
        '</section>' +
      '</div>' +
    '</div>';
}

/* ---------- shared pieces ---------- */

function sirChip(sid) {
  var su = suitById(sid);
  return '<span class="suitmark' + (su.red ? ' red' : '') + '">' + su.glyph + '</span>';
}

/* The rail: who is ahead, right now. This is also the stage the reveal plays
   on — every element the sequence animates lives here and is keyed by pid. */
function podiumHtml(s) {
  var st = standings(s);
  var rows = st.map(function (r, i) {
    return '<li class="pod' + (i === 0 ? ' first' : '') + '" data-pid="' + r.id + '">' +
      '<span class="podshock"></span>' +
      '<span class="podcrown">' + icon('crown', 20) + '</span>' +
      '<span class="poddelta" data-delta="' + r.id + '"></span>' +
      '<span class="podrank">' + (i + 1) + '</span>' +
      '<span class="podname">' + esc(r.name) + '</span>' +
      '<span class="podscore" data-score="' + r.id + '">' + r.total + '</span>' +
    '</li>';
  }).join('');
  var played = s.rounds.filter(function (r) { return r.stage !== 'bid'; }).length;
  return '<div class="podwrap">' +
    '<div class="panel-head"><h2>Standing</h2><span>live</span></div>' +
    '<ol class="podium" id="podium">' + rows + '</ol>' +
    '<div class="podfoot"><span>' + plural(played, 'round') + ' scored</span>' +
      '<span>' + plural(s.playerIds.length, 'player') + '</span></div>' +
  '</div>';
}

function deskHead(s, g, readonly) {
  var meta = '';
  if (!readonly) meta += '<span class="mchip livechip">' + icon('play', 11) + ' Live</span>';
  else meta += '<span class="mchip">Finished ' + fmtDate(s.finishedAt) + '</span>';
  meta += '<span class="mchip">' + plural(s.rounds.length, 'round') + '</span>';
  meta += '<span class="mchip">' + plural(s.playerIds.length, 'player') + '</span>';
  if (isBid(s)) {
    meta += '<span class="mchip">' + plural(Number(s.deckCount) || 1, 'deck') + ' &middot; up to ' + deckMax(s) + '</span>';
    meta += '<span class="mchip">' + plural(s.partnerCount || 1, 'partner') + '</span>';
  }
  if (readonly) meta += '<span class="mchip">Won by ' + esc(playerName(s.winnerId)) + '</span>';
  return '<div class="deskhead"><h1>' + gameNameHtml(g) + '</h1><div class="deskmeta">' + meta + '</div>' +
    (readonly ? '' : '<div class="deskacts">' +
      (s.rounds.length ? '<button class="btn btn-danger" id="finish">Finish session</button>' : '') +
    '</div>') + '</div>';
}

/* ---------- the round ledger ---------- */

function ledgerRow(s, r, idx) {
  var pts = roundPoints(s, r);
  var pending = r.stage !== 'done';
  var cards = (r.calls || []).map(function (c, ci) {
    return '<span class="lcall">' +
      '<span class="lcard' + (cardIsRed(c.card) ? ' red' : '') + '" data-lcard="' + ci + '">' +
        esc(c.card.rank) + suitById(c.card.suit).glyph + '</span>' +
      '<span class="lheld' + (c.holderId ? ' named' : '') + '">' +
        (c.holderId ? esc(playerName(c.holderId)) : 'not revealed') + '</span></span>';
  }).join('');
  var pill = s.playerIds.map(function (pid) {
    var v = pts[pid];
    return '<span class="ptcell' + (v > 0 ? ' won' : '') + '"><b>' + esc(playerName(pid)) + '</b>' +
      '<i>' + (pending ? '&mdash;' : '+' + v) + '</i></span>';
  }).join('');
  var stamp = pending
    ? '<span class="lstamp wait">awaiting reveal</span>'
    : '<span class="lstamp ' + (r.winner === 'bidding' ? 'won' : 'lost') + '">' +
      (r.winner === 'bidding' ? 'bidders won' : 'opponents won') + '</span>';
  return '<div class="lrow' + (pending ? ' pending' : '') + '" data-round="' + idx + '">' +
    '<span class="lno">R' + (idx + 1) + '</span>' +
    '<span class="lbid"><b>' + esc(playerName(r.bidderId)) + ' &middot; ' + r.bid + '</b>' +
      '<span>sir ' + sirChip(r.sir) + '</span></span>' +
    '<span class="lcards">' + cards + '</span>' +
    '<span class="lpts">' + pill + stamp + '</span>' +
  '</div>';
}

function ledgerHtml(s) {
  return '<section class="ledger">' +
    '<div class="console-head"><h2>Rounds</h2><span class="tag">' + plural(s.rounds.length, 'round') + '</span></div>' +
    (s.rounds.length
      ? s.rounds.map(function (r, i) { return ledgerRow(s, r, i); }).join('')
      : '<div class="empty">No rounds yet &mdash; fill the console above and save the first one.</div>') +
  '</section>';
}

/* ---------- the entry console: everything on one screen, one tap per value ---------- */

/* Names get the biggest type that still fits them all on one line — the
   more people at the table, the smaller the step down. */
function rackSize(n) {
  if (n <= 4) return 'rk-lg';
  if (n <= 6) return 'rk-md';
  if (n <= 8) return 'rk-sm';
  return 'rk-xs';
}

function quickBids(s) {
  var max = deckMax(s);
  var out = [];
  [0.4, 0.56, 0.68, 0.8, 1].forEach(function (f) {
    var v = Math.round(max * f / 5) * 5;
    if (out.indexOf(v) === -1) out.push(v);
  });
  return out;
}

function bidConsole(s) {
  var d = draftFor(s);

  var bidders = s.playerIds.map(function (pid) {
    return '<button class="pick" data-bidder="' + pid + '" aria-pressed="' + (d.bidderId === pid) + '">' +
      esc(playerName(pid)) + '</button>';
  }).join('');

  var quick = quickBids(s).map(function (v) {
    return '<button class="pick sq" data-bidset="' + v + '" aria-pressed="' + (d.bid === v) + '">' + v + '</button>';
  }).join('');

  var sirs = SUITS.map(function (su) {
    return '<button class="pick suitpick' + (su.red ? ' red' : '') + '" data-sir="' + su.id + '" ' +
      'aria-pressed="' + (d.sir === su.id) + '">' +
      '<span class="sglyph">' + su.glyph + '</span><span class="sname">' + su.name + '</span></button>';
  }).join('');

  var calls = d.calls.map(function (c, i) {
    var ranks = RANKS.map(function (rk) {
      var dead = SUITS.every(function (su) { return cardAtCapacity(i, rk, su.id); });
      return '<button class="pick sq" data-crank="' + i + '" data-rk="' + rk + '"' +
        (dead ? ' disabled' : '') + ' aria-pressed="' + (c.rank === rk) + '">' + rk + '</button>';
    }).join('');
    var suits = SUITS.map(function (su) {
      return '<button class="pick suitpick' + (su.red ? ' red' : '') + '" data-csuit="' + i + '" data-st="' + su.id + '"' +
        (cardAtCapacity(i, c.rank, su.id) ? ' disabled' : '') + ' aria-pressed="' + (c.suit === su.id) + '">' +
        '<span class="sglyph">' + su.glyph + '</span><span class="sname">' + su.name + '</span></button>';
    }).join('');
    return '<div class="callrow">' +
      '<span class="callno">Card ' + (i + 1) + '</span>' +
      '<span class="callpick"><span class="prow">' + ranks + '</span>' +
        '<span class="prow suits">' + suits + '</span></span>' +
      '<span class="callface' + (cardIsRed(c) ? ' red' : '') + '" data-cface="' + i + '">' +
        esc(c.rank) + suitById(c.suit).glyph + '</span>' +
    '</div>';
  }).join('');

  var ready = !!d.bidderId && !!d.bid;
  return '<section class="console" id="console">' +
    '<div class="console-head"><h2>New round</h2><span class="tag">before the cards are played</span></div>' +

    '<div class="step' + (d.bidderId ? ' done' : '') + '" data-step="bidder">' +
      '<span class="steplab"><span class="stepno">1</span><b>Who won<br>the bid</b></span>' +
      '<span class="stepbody rack ' + rackSize(s.playerIds.length) + '" ' +
        'style="grid-template-columns:repeat(' + s.playerIds.length + ',minmax(0,1fr))">' +
        bidders + '</span></div>' +

    '<div class="step' + (d.bid ? ' done' : '') + '" data-step="bid">' +
      '<span class="steplab"><span class="stepno">2</span><b>Bid<br>amount</b></span>' +
      '<span class="stepbody"><span class="bidbox">' +
        '<button class="stepbtn" data-bidstep="-5">&minus;</button>' +
        '<input class="bidnum" id="bidamt" type="number" inputmode="numeric" min="1" max="' + deckMax(s) +
          '" value="' + (d.bid || '') + '" placeholder="0" aria-label="Bid amount, up to ' + deckMax(s) + '">' +
        '<button class="stepbtn" data-bidstep="5">+</button></span>' +
        quick + '<span class="bidcap">max ' + deckMax(s) + '</span></span></div>' +

    '<div class="step done" data-step="sir">' +
      '<span class="steplab"><span class="stepno">3</span><b>Sir &mdash;<br>the trump</b></span>' +
      '<span class="stepbody rack sirrack" ' +
        'style="grid-template-columns:repeat(4,minmax(0,1fr))">' + sirs + '</span></div>' +

    '<div class="step done" data-step="cards">' +
      '<span class="steplab"><span class="stepno">4</span><b>Cards<br>asked for</b></span>' +
      '<span class="stepbody" style="display:block">' + calls +
        (deckCount(s) > 1
          ? '<p class="hint">' + plural(deckCount(s), 'deck') + ' on the table &mdash; the same card can be ' +
            'asked for up to ' + plural(deckCount(s), 'time') + '.</p>'
          : '') +
      '</span></div>' +

    '<div class="saverow">' +
      '<span class="readout" id="readout">' + consoleReadout(s, d) + '</span>' +
      '<span class="grow"></span>' +
      '<button class="btn btn-primary" id="savehand"' + (ready ? '' : ' disabled') + '>Save round</button>' +
    '</div>' +
  '</section>';
}

function consoleReadout(s, d) {
  if (!d.bidderId) return 'Pick the bidder to start.';
  if (!d.bid) return '<b>' + esc(playerName(d.bidderId)) + '</b> &mdash; now the bid.';
  return '<b>' + esc(playerName(d.bidderId)) + '</b> bid <b>' + d.bid + '</b> on ' + sirChip(d.sir) +
    ' for ' + d.calls.map(function (c) {
      return '<b>' + esc(c.rank) + suitById(c.suit).glyph + '</b>';
    }).join(', ');
}

/* the reveal console — same shape, so the eye does not have to relearn it */
function revealConsole(s, r, idx) {
  /* On two or three decks the same card can be asked for more than once, so
     two steps can show the same face. Number the copies or they are
     indistinguishable. */
  var tally = {}, copies = {};
  (r.calls || []).forEach(function (c) {
    var k = c.card.rank + c.card.suit;
    copies[k] = (copies[k] || 0) + 1;
  });
  var rows = (r.calls || []).map(function (c, ci) {
    var key = c.card.rank + c.card.suit;
    tally[key] = (tally[key] || 0) + 1;
    var dup = copies[key] > 1 ? '<em class="copyno">copy ' + tally[key] + ' of ' + copies[key] + '</em>' : '';
    var opts = s.playerIds.filter(function (pid) { return pid !== r.bidderId; }).map(function (pid) {
      return '<button class="pick" data-holder="' + ci + '" data-hp="' + pid + '" aria-pressed="' +
        (c.holderId === pid) + '">' + esc(playerName(pid)) + '</button>';
    }).join('');
    return '<div class="step' + (c.holderId ? ' done' : '') + '" data-hstep="' + ci + '">' +
      '<span class="steplab"><span class="stepno">' + (ci + 1) + '</span><b>Who held<br>' +
        '<span class="callface' + (cardIsRed(c.card) ? ' red' : '') + '" style="width:52px;height:66px;font-size:19px;margin-top:6px">' +
        esc(c.card.rank) + suitById(c.card.suit).glyph + '</span>' + dup + '</b></span>' +
      '<span class="stepbody rack ' + rackSize(s.playerIds.length - 1) + '" ' +
        'style="grid-template-columns:repeat(' + (s.playerIds.length - 1) + ',minmax(0,1fr))">' +
        opts + '</span></div>';
  }).join('');
  var allHeld = (r.calls || []).every(function (c) { return !!c.holderId; });
  return '<section class="console" id="console">' +
    '<div class="console-head"><h2>Round ' + (idx + 1) + ' &mdash; reveal</h2>' +
      '<span class="tag hot">' + esc(playerName(r.bidderId)) + ' bid ' + r.bid + ' on ' +
      suitById(r.sir).glyph + '</span></div>' +
    rows +
    '<div class="step" data-step="won">' +
      '<span class="steplab"><span class="stepno">' + ((r.calls || []).length + 1) + '</span><b>Who won<br>the round</b></span>' +
      '<span class="stepbody" style="display:block"><span class="winrow">' +
        '<button class="winbtn bid" data-win="bidding" data-ridx="' + idx + '"' + (allHeld ? '' : ' disabled') + '>' +
          'Bidder&rsquo;s team won<small>they take the bid, each share over</small></button>' +
        '<button class="winbtn opp" data-win="opposition" data-ridx="' + idx + '"' + (allHeld ? '' : ' disabled') + '>' +
          'Opponents won<small>every opponent takes the bid, flat</small></button>' +
      '</span>' +
      '<p class="hint">Name the same player twice if both called cards were in one hand &mdash; they score double.</p>' +
      '</span></div>' +
    '<div class="saverow"><span class="readout">Scores land the moment you tap a winner.</span>' +
      '<span class="grow"></span>' +
      '<button class="btn btn-ghost" data-cancelhand="' + idx + '">Discard round</button></div>' +
  '</section>';
}

/* ---------- session ---------- */

function viewSession(id) {
  var s = null;
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].id === id) s = state.sessions[i];
  if (!s) return header({ back: '/' }) + '<div class="panel skin"><div class="empty">That session no longer exists.</div></div>';

  var g = gameById(s.gameId);
  var readonly = s.status === 'finished';
  var html = header({ back: readonly ? '/archives' : '/' }) + deskHead(s, g, readonly);

  html += '<div class="desk"><div class="rail">' + podiumHtml(s) + '</div><div class="deskmain">';

  if (isBid(s)) {
    var pend = pendingRound(s);
    if (!readonly) html += pend ? revealConsole(s, pend, s.rounds.indexOf(pend)) : bidConsole(s);
    html += ledgerHtml(s);
    html += bidSheetHtml(s);
  } else {
    html += numericSheetHtml(s, readonly);
  }

  return html + '</div></div>';
}

/* names in one row, each round below as Round 1, Round 2, ... */
function bidSheetHtml(s) {
  var t = totals(s);

  var head = '<tr><th>Round</th>' + s.playerIds.map(function (pid) {
    return '<th>' + esc(playerName(pid)) + '</th>';

  var body = s.rounds.map(function (r, ri) {

    return '<tr' + (pending ? ' class="pending"' : '') + '><td class="rnum">Round ' + (ri + 1) + '</td>' +
      s.playerIds.map(function (pid) {

    '<div class="panel-head"><h2>Scoresheet</h2><span>this session</span></div>' +

   ------------------------------------------------------------------ */

function loadSample() {
  var names = ['Abhi', 'Priya', 'Rahul', 'Nikhil', 'Sneha'];
  state.players = names.map(function (n) { return { id: uid(), name: n, active: true }; });
  var ids = state.players.map(function (p) { return p.id; });
  var day = 86400000;
  var suits = ['S', 'H', 'D', 'C'];
  var ranks = ['A', 'K', 'Q', 'J', '10'];

  function bidHand(playersIn, bidderIdx, bid, holderIdxs, won, seed) {
    return {
      stage: 'done',
      bidderId: playersIn[bidderIdx],
      bid: bid,
      sir: suits[seed % 4],
      calls: holderIdxs.map(function (hi, n) {
        return { card: { rank: ranks[(seed + n) % ranks.length], suit: suits[(seed + n + 1) % 4] },
                 holderId: playersIn[hi] };
      }),
      winner: won ? 'bidding' : 'opposition'
    };
  }

  function spadeSession(playersIn, partnerCount, deckCount, hands, daysAgo) {
    var s = { id: uid(), gameId: 'spade3', roundType: 'bid', playerIds: playersIn,
              deckCount: deckCount, partnerCount: partnerCount,
              status: 'finished', createdAt: Date.now() - daysAgo * day, rounds: [] };
    for (var h = 0; h < hands; h++) {
      var b = h % playersIn.length;
      var holders = [];
      for (var k = 0; k < partnerCount; k++) {
        var pick = (b + 1 + k) % playersIn.length;
        holders.push(pick);
      }
      s.rounds.push(bidHand(playersIn, b, 150 + ((h * 10) % 80), holders, h % 3 !== 0, h));
    }
    s.finishedAt = Date.now() - daysAgo * day;
    s.winnerId = standings(s)[0].id;
    return s;
  }

  function numericSession(playersIn, rounds, daysAgo) {
    var s = { id: uid(), gameId: 'kachufull', roundType: 'numeric', playerIds: playersIn,
              status: 'finished', createdAt: Date.now() - daysAgo * day, rounds: [] };
    for (var r = 0; r < rounds; r++) {
      var sc = {};
      playersIn.forEach(function (pid) { sc[pid] = Math.floor(20 + Math.random() * 60); });
      s.rounds.push({ scores: sc });
    }
    s.finishedAt = Date.now() - daysAgo * day;
    s.winnerId = standings(s)[0].id;
    return s;
  }

  state.sessions = [
    spadeSession(ids.slice(0, 4), 1, 1, 6, 21),
    numericSession(ids.slice(1, 5), 5, 16),
    spadeSession(ids.slice(0, 4), 2, 2, 5, 9)
  ];

  /* one night still in progress, with a hand awaiting its reveal */
  var live = { id: uid(), gameId: 'spade3', roundType: 'bid', playerIds: ids.slice(0, 4),
               deckCount: 1, partnerCount: 1, status: 'live', createdAt: Date.now(), rounds: [] };
  live.rounds.push(bidHand(live.playerIds, 0, 180, [1], true, 0));
  live.rounds.push(bidHand(live.playerIds, 2, 165, [0], false, 3));
  state.sessions.push(live);
  save();
}

/* ------------------------------------------------------------------
   9. ROUTER + EVENTS
   ------------------------------------------------------------------ */

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'terminal');
}

var firstRender = true;
var lastPath = null;

function render() {
  applyTheme();
  /* The entrance reveal is armed for the first paint only. Any later render —
     a tap, a route change — settles the body BEFORE the markup swap, so the
     new nodes never replay the fade-in from zero. Without this, a tap inside
     the first 1.3s replayed the whole entrance and read as a blank screen. */
  if (!firstRender) document.body.classList.add('settled');
  var hash = location.hash.slice(1) || '/';
  var path = hash.split('?')[0];
  var query = hash.slice(path.length);
  var app = $('#app');
  /* the console and the rail need the room; the home floor does not */
  app.className = 'wrap' + (path === '/new' || path.indexOf('/session/') === 0 ? ' wide' : '');

  if (path === '/') app.innerHTML = viewHome();
  else if (path === '/new') app.innerHTML = viewNew(query);
  else if (path.indexOf('/session/') === 0) app.innerHTML = viewSession(path.slice(9));
  else if (path === '/archives') app.innerHTML = viewArchives();
  else if (path === '/players') app.innerHTML = viewPlayers();
  else if (path === '/admin') app.innerHTML = viewAdmin();
  else app.innerHTML = viewHome();

  if (path !== lastPath) { window.scrollTo(0, 0); lastPath = path; }
  buildConfetti();
  firstRender = false;
}

function buildConfetti() {
  var box = $('#conf');
  if (box.childNodes.length) return;
  var cols = ['#ffe066', '#2440a8', '#00a878', '#ffffff'];
  var out = '';
  for (var i = 0; i < 10; i++) {
    out += '<i style="left:' + (4 + i * 9.8) + '%;background:' + cols[i % 4] +
      ';animation-delay:' + (i * 0.83).toFixed(2) + 's;transform:rotate(' + ((i * 27) % 70) + 'deg)"></i>';
  }
  box.innerHTML = out;
}

function currentSession() {
  var path = (location.hash.slice(1) || '/').split('?')[0];
  if (path.indexOf('/session/') !== 0) return null;
  var id = path.slice(9);
  for (var i = 0; i < state.sessions.length; i++) if (state.sessions[i].id === id) return state.sessions[i];
  return null;
}

function pickedValue(rowSel, attr) {

/* the PIN pad is updated in place — a full re-render would restart the
   panel's entrance animation and make the pad blink on every key press */
/* One dot per character actually entered — the pad gives nothing away about
   how long the PIN is. */
function updatePinDots(err) {
  var box = $('#pindots');
  if (box) {
    var out = '';
    for (var i = 0; i < pinBuffer.length; i++) out += '<span class="on"></span>';
    box.innerHTML = out;
    box.classList.toggle('shake', !!err);
  }
  var hint = $('#pinhint');
  if (hint) hint.textContent = err ? 'That PIN was not recognised \u2014 try again' : '';
}

/* Each called card is two independent selects (rank, suit), so a "card" is a
   pair across two controls — live duplicate prevention has to consider both
   together. After any picker changes, disable the suit option in every OTHER
   picker that would recreate an already-used rank+suit pair for that
   picker's own current rank; if a picker's own selection was just made
   invalid by someone else's edit, nudge it to the first free suit rather
   than leave a silent duplicate selected. The submit-time check in
   'savehand' stays as a safety net for whatever this can't reach. */
/* ------------------------------------------------------------------
   THE CONSOLE DRAFT — the round being typed in, never persisted.
   Held in memory so a tap can repaint a chip in place instead of
   re-rendering the view and losing focus, animation and scroll.
   ------------------------------------------------------------------ */

var draft = null;

function newDraft(s) {
  var d = { sid: s.id, decks: deckCount(s), bidderId: null, bid: null, sir: 'S', calls: [] };
  var n = s.partnerCount || 1;
  for (var i = 0; i < n; i++) {
    d.calls.push({ rank: RANKS[i % RANKS.length], suit: SUITS[i % SUITS.length].id });
  }
  draft = d;
  resolveCallClashes();
  return d;
}

function draftFor(s) {
  if (!draft || draft.sid !== s.id || draft.calls.length !== (s.partnerCount || 1) ||
      draft.decks !== deckCount(s)) return newDraft(s);
  return draft;
}

/* How many copies of one card are in play. Two decks on the table means the
   bidder can ask for the same card twice — both copies exist — and three decks
   means three times. A card is not "taken", it has capacity. */
function cardCopies(idx, rank, suit) {
  var n = 0;
  if (!draft) return 0;
  for (var i = 0; i < draft.calls.length; i++) {
    if (i === idx) continue;
    if (draft.calls[i].rank === rank && draft.calls[i].suit === suit) n++;
  }
  return n;
}

function cardAtCapacity(idx, rank, suit) {
  return cardCopies(idx, rank, suit) >= ((draft && draft.decks) || 1);
}

/* Walk any picker that has pushed a card past the number of copies the deck
   count allows onto the nearest card with room — suit first, then rank, since
   five pickers cannot all fit in the four suits of a single rank. */
function resolveCallClashes() {
  for (var i = 0; i < draft.calls.length; i++) {
    var c = draft.calls[i];
    if (!cardAtCapacity(i, c.rank, c.suit)) continue;
    var placed = false;
    for (var su = 0; su < SUITS.length && !placed; su++) {
      if (!cardAtCapacity(i, c.rank, SUITS[su].id)) { c.suit = SUITS[su].id; placed = true; }
    }
    for (var rk = 0; rk < RANKS.length && !placed; rk++) {
      for (var su2 = 0; su2 < SUITS.length && !placed; su2++) {
        if (!cardAtCapacity(i, RANKS[rk], SUITS[su2].id)) { c.rank = RANKS[rk]; c.suit = SUITS[su2].id; placed = true; }
      }
    }
  }
}

/* Repaint the console from the draft without touching the DOM tree — chips
   flip state, dead cards grey out, the readout and Save button follow. */
function paintConsole(s) {
  var d = draft;
  if (!d) return;
  $$('[data-bidder]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-bidder') === d.bidderId));
  });
  $$('[data-sir]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-sir') === d.sir));
  });
  $$('[data-bidset]').forEach(function (b) {
    b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-bidset')) === d.bid));
  });
  var amt = $('#bidamt');
  if (amt && Number(amt.value) !== d.bid) amt.value = d.bid || '';

  d.calls.forEach(function (c, i) {
    $$('[data-crank="' + i + '"]').forEach(function (b) {
      var rk = b.getAttribute('data-rk');
      b.setAttribute('aria-pressed', String(c.rank === rk));
      b.disabled = SUITS.every(function (su) { return cardAtCapacity(i, rk, su.id); });
    });
    $$('[data-csuit="' + i + '"]').forEach(function (b) {
      var st = b.getAttribute('data-st');
      b.setAttribute('aria-pressed', String(c.suit === st));
      b.disabled = cardAtCapacity(i, c.rank, st);
    });
    var face = $('[data-cface="' + i + '"]');
    if (face) {
      var txt = c.rank + suitById(c.suit).glyph;
      if (face.textContent !== txt) {
        face.textContent = txt;
        face.className = 'callface' + (cardIsRed(c) ? ' red' : '');
        face.classList.remove('flip');
        void face.offsetWidth;
        face.classList.add('flip');
      }
    }
  });

  var stepB = $('[data-step="bidder"]'); if (stepB) stepB.classList.toggle('done', !!d.bidderId);
  var stepA = $('[data-step="bid"]');    if (stepA) stepA.classList.toggle('done', !!d.bid);
  var out = $('#readout'); if (out) out.innerHTML = consoleReadout(s, d);
  var save = $('#savehand'); if (save) save.disabled = !(d.bidderId && d.bid);
}

/* ------------------------------------------------------------------
   THE REVEAL — the point of the whole screen. Tapping a winner scores
   the round, so the board is about to change and possibly change hands.
   Stamp the result, flip the called cards, count every score up, then
   slide the podium into its new order and crown whoever came out on top.
   ------------------------------------------------------------------ */

var revealTimers = [];
var revealEnd = null;

function reducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function at(ms, fn) { revealTimers.push(setTimeout(fn, ms)); }

function clearReveal() {
  revealTimers.forEach(clearTimeout);
  revealTimers = [];
}

function skipReveal() {
  if (!revealEnd) return;
  clearReveal();
  var fn = revealEnd;
  revealEnd = null;
  fn();
}

function countUp(el, from, to, ms) {
  if (from === to) { el.textContent = to; return; }
  var t0 = performance.now();
  (function step(now) {
    var p = Math.min(1, (now - t0) / ms);
    var e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
    else el.textContent = to;
  })(performance.now());
}

function burstFrom(el) {
  var box = el.getBoundingClientRect();
  var cols = ['#ffe066', '#ff4d6d', '#2ec4b6', '#4d96ff', '#c77dff'];
  for (var i = 0; i < 22; i++) {
    var b = document.createElement('i');
    b.className = 'burst';
    b.style.background = cols[i % cols.length];
    b.style.left = (box.left + box.width / 2) + 'px';
    b.style.top = (box.top + box.height / 2) + 'px';
    var ang = (Math.PI * 2 * i) / 22 + Math.random() * 0.4;
    var dist = 90 + Math.random() * 130;
    b.style.setProperty('--bx', Math.cos(ang) * dist + 'px');
    b.style.setProperty('--by', (Math.sin(ang) * dist - 40) + 'px');
    document.body.appendChild(b);
    (function (node) { setTimeout(function () { node.remove(); }, 1000); })(b);
  }
}

/* Read where every player sits now, re-render into the new order, then put
   the rows back where they were and let them travel — FLIP, so the swap is
   a real move rather than a jump. */
function playReveal(s, idx, beforeTotals, beforeOrder) {
  var firstRects = {};
  $$('.pod').forEach(function (el) {
    firstRects[el.getAttribute('data-pid')] = el.getBoundingClientRect();
  });

  render();

  var after = totals(s);
  var afterOrder = standings(s).map(function (x) { return x.id; });
  var leaderChanged = beforeOrder.length && afterOrder[0] !== beforeOrder[0];
  var pods = $$('.pod');
  var row = $('.lrow[data-round="' + idx + '"]');

  function finish() {
    document.body.classList.remove('revealing');
    var hint = $('#skiphint'); if (hint) hint.remove();
    pods.forEach(function (el) {
      el.style.transition = ''; el.style.transform = '';
      el.classList.remove('mover');
      var sc = $('[data-score="' + el.getAttribute('data-pid') + '"]', el);
      if (sc) sc.textContent = after[el.getAttribute('data-pid')];
    });
    render();
  }

  if (reducedMotion()) { finish(); return; }

  document.body.classList.add('revealing');
  var hint = document.createElement('div');
  hint.className = 'skiphint'; hint.id = 'skiphint'; hint.textContent = 'tap to skip';
  document.body.appendChild(hint);
  revealEnd = finish;

  /* hold the board exactly as it looked a moment ago */
  pods.forEach(function (el) {
    var pid = el.getAttribute('data-pid');
    var sc = $('[data-score="' + pid + '"]', el);
    if (sc) sc.textContent = beforeTotals[pid] === undefined ? 0 : beforeTotals[pid];
    var f = firstRects[pid];
    if (!f) return;
    var l = el.getBoundingClientRect();
    var dx = f.left - l.left, dy = f.top - l.top;
    if (!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    el.classList.add('mover');
  });

  /* 1 — the verdict lands */
  if (row) {
    var stamp = $('.lstamp', row);
    if (stamp) stamp.classList.add('stamped');
    $$('.lcard', row).forEach(function (el, i) {
      el.style.animationDelay = (0.16 + i * 0.13) + 's';
      el.classList.add('flip');
    });
  }

  /* 2 — the scores climb */
  at(620, function () {
    pods.forEach(function (el) {
      var pid = el.getAttribute('data-pid');
      var from = beforeTotals[pid] === undefined ? 0 : beforeTotals[pid];
      var to = after[pid];
      var sc = $('[data-score="' + pid + '"]', el);
      if (sc) countUp(sc, from, to, 880);
      if (to > from) {
        var dl = $('[data-delta="' + pid + '"]', el);
        if (dl) { dl.textContent = '+' + (to - from); dl.classList.add('up'); }
      }
    });
  });

  /* 3 — the board re-orders itself */
  at(1620, function () {
    pods.forEach(function (el) {
      el.style.transition = 'transform .72s cubic-bezier(.34,1.56,.64,1)';
      el.style.transform = 'translate(0,0)';
    });
  });

  /* 4 — and the new leader is crowned */
  at(2280, function () {
    if (!leaderChanged) return;
    var top = $('.pod.first');
    if (!top) return;
    top.classList.add('crowned');
    burstFrom(top);
  });

  at(leaderChanged ? 3500 : 2700, function () {
    revealEnd = null;
    finish();
  });
}

document.addEventListener('click', function (e) {
  /* a reveal is playing — the first tap anywhere fast-forwards it */
  if (revealEnd) { skipReveal(); return; }

  var t = e.target.closest('[data-go]');
  if (t) { go(t.getAttribute('data-go')); return; }

  if (e.target.id === 'seed') { loadSample(); render(); return; }

  if (e.target.id === 'livetoggle') {
    var wrap = $('#livewrap');
    var open = wrap.classList.toggle('open');
    e.target.textContent = open ? 'Show fewer' : 'Show all ' + liveSessions().length;
    return;
  }

  /* ---------- new session ---------- */
  if (e.target.closest('#playersel button')) {
    var p = e.target.closest('button');
    p.setAttribute('aria-pressed', p.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    paintPlayerCount();
    return;
  }
  var allp = e.target.closest('[data-allplayers]');
  if (allp) {
    var on = allp.getAttribute('data-allplayers') === '1';
    $$('#playersel button').forEach(function (b) { b.setAttribute('aria-pressed', String(on)); });
    paintPlayerCount();
    return;
  }
  var deckBtn = e.target.closest('#decksel button');
  if (deckBtn) {
    pickOne($('#decksel'), deckBtn);
    var hint = $('#deckhint');
    if (hint) hint.textContent = 'Bids can go up to ' + (Number(deckBtn.getAttribute('data-deck')) * DECK_POINTS) + '.';
    return;
  }
  var partBtn = e.target.closest('#partsel button');
  if (partBtn) { pickOne($('#partsel'), partBtn); return; }

  if (e.target.id === 'start') {
    var gid = e.target.getAttribute('data-game');
    var g = gameById(gid);
    var chosen = $$('#playersel button[aria-pressed="true"]').map(function (x) { return x.getAttribute('data-player'); });
    if (g.roundType === 'bid' && chosen.length < 3) {
      alert('3 of Spade needs at least three players — a bidder, a partner and someone to play against.');
      return;
    }
    if (!chosen.length) { alert('Pick at least one player.'); return; }
    var sess = { id: uid(), gameId: gid, roundType: g.roundType, playerIds: chosen,
                 status: 'live', createdAt: Date.now(), rounds: [] };
    if (g.roundType === 'bid') {
      sess.deckCount = Number(pickedValue('#decksel', 'data-deck')) || 1;
      sess.partnerCount = Number(pickedValue('#partsel', 'data-part')) || 1;
    }
    state.sessions.push(sess); save(); go('/session/' + sess.id); return;
  }

  /* ---------- the round console ---------- */
  var bpk = e.target.closest('[data-bidder]');
  if (bpk) {
    var sb = currentSession(); if (!sb) return;
    draftFor(sb).bidderId = bpk.getAttribute('data-bidder'); paintConsole(sb); return;
  }
  var spk = e.target.closest('[data-sir]');
  if (spk) {
    var ssr = currentSession(); if (!ssr) return;
    draftFor(ssr).sir = spk.getAttribute('data-sir'); paintConsole(ssr); return;
  }
  var qbd = e.target.closest('[data-bidset]');
  if (qbd) {
    var sqb = currentSession(); if (!sqb) return;
    draftFor(sqb).bid = Number(qbd.getAttribute('data-bidset')); paintConsole(sqb); return;
  }
  var stp = e.target.closest('[data-bidstep]');
  if (stp) {
    var sst = currentSession(); if (!sst) return;
    var dst = draftFor(sst);
    var nv = (dst.bid || 0) + Number(stp.getAttribute('data-bidstep'));
    dst.bid = Math.max(0, Math.min(deckMax(sst), nv)) || null;
    paintConsole(sst); return;
  }
  var crk = e.target.closest('[data-crank]');
  if (crk) {
    var sc1 = currentSession(); if (!sc1) return;
    var d1 = draftFor(sc1), i1 = Number(crk.getAttribute('data-crank'));
    d1.calls[i1].rank = crk.getAttribute('data-rk');
    resolveCallClashes(); paintConsole(sc1); return;
  }
  var cst = e.target.closest('[data-csuit]');
  if (cst) {
    var sc2 = currentSession(); if (!sc2) return;
    var d2 = draftFor(sc2), i2 = Number(cst.getAttribute('data-csuit'));
    d2.calls[i2].suit = cst.getAttribute('data-st');
    resolveCallClashes(); paintConsole(sc2); return;
  }

  if (e.target.id === 'savehand') {
    var s1 = currentSession(); if (!s1) return;
    var d = draftFor(s1);
    if (!d.bidderId) { alert('Pick who won the bid.'); return; }
    if (!d.bid || d.bid < 1 || d.bid > deckMax(s1)) { alert('Bid must be between 1 and ' + deckMax(s1) + '.'); return; }
    var calls = d.calls.map(function (c) { return { card: { rank: c.rank, suit: c.suit }, holderId: null }; });
    /* one copy of a card per deck on the table, no more */
    var decks = deckCount(s1), seen = {};
    for (var k = 0; k < calls.length; k++) {
      var key = calls[k].card.rank + calls[k].card.suit;
      seen[key] = (seen[key] || 0) + 1;
      if (seen[key] > decks) {
        alert(cardLabel(calls[k].card) + ' can only be asked for ' + plural(decks, 'time') +
              ' with ' + plural(decks, 'deck') + ' in play.');
        return;
      }
    }
    s1.rounds.push({ stage: 'bid', bidderId: d.bidderId, bid: d.bid,
                     sir: d.sir, calls: calls, winner: null });
    newDraft(s1); save(); render();
    var fresh = $('.lrow[data-round="' + (s1.rounds.length - 1) + '"]');
    if (fresh) fresh.classList.add('dealt');
    return;
  }

  var disc = e.target.closest('[data-cancelhand]');
  if (disc) {
    var s2 = currentSession(); if (!s2) return;
    if (!confirm('Discard this round? Nothing has been scored from it yet.')) return;
    s2.rounds.splice(Number(disc.getAttribute('data-cancelhand')), 1);
    save(); render(); return;
  }

  /* naming a holder repaints in place — re-rendering here would throw away
     the chips the user is still working through */
  var hold = e.target.closest('[data-holder]');
  if (hold) {
    var s3 = currentSession(); if (!s3) return;
    var pr = pendingRound(s3); if (!pr) return;
    var ci = Number(hold.getAttribute('data-holder'));
    pr.calls[ci].holderId = hold.getAttribute('data-hp');
    save();
    $$('button', hold.parentNode).forEach(function (bt) {
      bt.setAttribute('aria-pressed', String(bt === hold));
    });
    var stepEl = hold.closest('.step'); if (stepEl) stepEl.classList.add('done');
    var allHeld = pr.calls.every(function (c) { return !!c.holderId; });
    $$('[data-win]').forEach(function (bt) { bt.disabled = !allHeld; });
    var lrow = $('.lrow[data-round="' + s3.rounds.indexOf(pr) + '"]');
    if (lrow) {
      $$('.lheld', lrow).forEach(function (el, li) {
        var h = pr.calls[li] && pr.calls[li].holderId;
        el.textContent = h ? playerName(h) : 'not revealed';
        el.className = 'lheld' + (h ? ' named' : '');
      });
    }
    return;
  }

  var win = e.target.closest('[data-win]');
  if (win) {
    var s4 = currentSession(); if (!s4) return;
    var widx = Number(win.getAttribute('data-ridx'));
    var r = s4.rounds[widx];
    if (!r) return;
    if (r.calls.some(function (c) { return !c.holderId; })) { alert('Say who held each called card first.'); return; }
    var shares = biddingShares(r);
    if (s4.playerIds.filter(function (pid) { return !shares[pid]; }).length === 0) {
      alert('Everyone cannot be on the bidding side — someone has to be the opposition.');
      return;
    }
    var beforeTotals = totals(s4);
    var beforeOrder = standings(s4).map(function (x) { return x.id; });
    r.winner = win.getAttribute('data-win');
    r.stage = 'done';
    save();
    playReveal(s4, widx, beforeTotals, beforeOrder);
    return;
  }

  /* ---------- numeric rounds ---------- */
  if (e.target.id === 'addround') {
    var s5 = currentSession(); if (!s5) return;
    var sc = {}; s5.playerIds.forEach(function (pid) { sc[pid] = 0; });
    s5.rounds.push({ scores: sc }); save(); render();
    var first = $('.cell[data-round="' + (s5.rounds.length - 1) + '"]');
    if (first) { first.focus(); first.select(); }
    return;
  }
  if (e.target.id === 'delround') {
    var s6 = currentSession(); if (!s6 || !s6.rounds.length) return;
    if (!confirm('Delete the last round? This cannot be undone.')) return;
    s6.rounds.pop(); save(); render(); return;
  }

  if (e.target.id === 'finish') {
    var s7 = currentSession(); if (!s7) return;
    if (pendingRound(s7)) { alert('Finish revealing the last round before closing the session.'); return; }
    var winr = standings(s7)[0];
    if (!confirm('Finish this session? ' + winr.name + ' wins with ' + winr.total + '.')) return;
    s7.status = 'finished'; s7.finishedAt = Date.now(); s7.winnerId = winr.id;
    save(); go('/archives'); return;
  }

  /* ---------- players ---------- */
  if (e.target.id === 'addplayer') {
    var nm = ($('#newplayer').value || '').trim();
    if (!nm) return;
    state.players.push({ id: uid(), name: nm, active: true }); save(); render(); return;
  }
  var tog = e.target.closest('[data-toggle]');
  if (tog) {
    var pid2 = tog.getAttribute('data-toggle');
    state.players.forEach(function (p) { if (p.id === pid2) p.active = p.active === false; });
    save(); render(); return;
  }
  var rem = e.target.closest('[data-remove]');
  if (rem) {
    var pid3 = rem.getAttribute('data-remove');
    var used = state.sessions.some(function (s) { return s.playerIds.indexOf(pid3) !== -1; });
    if (used) { alert('That player appears in recorded sessions, so removing them would break the history. Disable them instead.'); return; }
    state.players = state.players.filter(function (p) { return p.id !== pid3; });
    save(); render(); return;
  }

  /* ---------- admin ---------- */
  var key = e.target.closest('[data-key]');
  if (key) {
    var k = key.getAttribute('data-key');
    if (k === 'CLR') { pinBuffer = ''; updatePinDots(false); return; }
    if (k === 'OK') {
      if (pinBuffer === adminPin()) { adminUnlocked = true; pinBuffer = ''; render(); return; }
      pinBuffer = ''; updatePinDots(true); return;
    }
    if (pinBuffer.length < PIN_MAX) { pinBuffer += k; updatePinDots(false); }
    return;
  }
  var atab = e.target.closest('[data-atab]');
  if (atab) { adminTab = atab.getAttribute('data-atab'); render(); return; }

  var flag = e.target.closest('[data-flag]');
  if (flag) {
    if (!state.settings.flags) state.settings.flags = {};
    var fid = flag.getAttribute('data-flag');
    var next = !state.settings.flags[fid];
    state.settings.flags[fid] = next;
    flag.setAttribute('aria-checked', String(next));
    save();
    return;
  }

  if (e.target.id === 'fbsave' || e.target.id === 'fbtest') {
    var cfg = {};
    $$('[data-fb]').forEach(function (i) {
      var v = i.value.trim();
      if (v) cfg[i.getAttribute('data-fb')] = v;
    });
    state.settings.firebase = cfg;
    save();
    var out = $('#fbstatus'), where = $('#fbwhere');
    if (where) {
      where.textContent = firebaseConfig() ? 'configured \u00b7 ' + firebaseName() : 'not configured';
      where.className = 'tag' + (firebaseConfig() ? ' hot' : '');
    }
    if (e.target.id === 'fbsave') {
      if (out) out.textContent = firebaseConfig()
        ? 'Saved. Run a test to prove it reaches Firestore.'
        : 'Needs at least a project ID and an API key.';
      return;
    }
    if (!firebaseConfig()) {
      if (out) out.textContent = 'Fill in at least the project ID and the API key first.';
      return;
    }
    if (out) out.textContent = 'Testing\u2026';
    e.target.disabled = true;
    firebaseTest().then(function (r) {
      if (out) out.innerHTML = '<b>Connected.</b> Round trip to ' + esc(firebaseName()) + ' in ' + r.ms + 'ms.';
    }).catch(function (err) {
      var msg = (err && (err.code || err.message)) ? String(err.code || err.message) : String(err);
      if (out) out.innerHTML = '<b>Not connected.</b> ' + esc(msg);
    }).then(function () { if (e.target) e.target.disabled = false; });
    return;
  }

  if (e.target.id === 'fbclear') {
    if (!confirm('Disconnect this Firestore project? Scores go back to being kept on this device only.')) return;
    delete state.settings.firebase;
    save(); render(); return;
  }

  var th = e.target.closest('[data-theme-set]');
  if (th) { state.settings.theme = th.getAttribute('data-theme-set'); save(); render(); return; }
  if (e.target.id === 'lock') { adminUnlocked = false; go('/'); return; }
  if (e.target.id === 'wipe') {
    if (!confirm('Erase every player, session and setting on this device? This cannot be undone.')) return;
    state = blankState(); save(); adminUnlocked = false; go('/'); render(); return;
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'bidamt') {
    var sbd = currentSession(); if (!sbd) return;
    var raw = Number(e.target.value);
    draftFor(sbd).bid = raw > 0 ? Math.min(raw, deckMax(sbd)) : null;
    paintConsole(sbd);
    return;
  }
  var cell = e.target.closest('.cell');
  if (cell) {
    var s = currentSession(); if (!s) return;
    var ri = Number(cell.getAttribute('data-round'));
    var pid = cell.getAttribute('data-player');
    s.rounds[ri].scores[pid] = cell.value === '' ? 0 : Number(cell.value);
    save();
    updateTotals(s);
    return;
  }
  var ren = e.target.closest('[data-rename]');
  if (ren) {
    var id = ren.getAttribute('data-rename');
    state.players.forEach(function (p) { if (p.id === id) p.name = ren.value; });
    save();
  }
});

/* Slide the rail into a new order without a re-render — same FLIP the
   reveal uses, just quicker, for a score typed into the sheet. */
function refreshPodium(s) {
  var box = $('#podium'); if (!box) return;
  var t = totals(s);
  var order = standings(s).map(function (x) { return x.id; });
  var rects = {};
  $$('.pod', box).forEach(function (el) { rects[el.getAttribute('data-pid')] = el.getBoundingClientRect(); });
  order.forEach(function (pid, i) {
    var el = $('.pod[data-pid="' + pid + '"]', box);
    if (!el) return;
    box.appendChild(el);
    el.classList.toggle('first', i === 0);
    var rk = $('.podrank', el); if (rk) rk.textContent = i + 1;
    var sc = $('[data-score="' + pid + '"]', el); if (sc) sc.textContent = t[pid];
  });
  $$('.pod', box).forEach(function (el) {
    var f = rects[el.getAttribute('data-pid')]; if (!f) return;
    var l = el.getBoundingClientRect();
    var dx = f.left - l.left, dy = f.top - l.top;
    if (!dx && !dy) return;
    el.style.transition = 'none';
    el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    requestAnimationFrame(function () {
      el.style.transition = 'transform .52s cubic-bezier(.34,1.56,.64,1)';
      el.style.transform = 'translate(0,0)';
    });
  });
}

/* recompute the numeric footer in place, so focus is never stolen mid-entry */
function updateTotals(s) {
  var t = totals(s);
  var st = standings(s);
  var leader = st[0];
  var foot = $$('.sheet tfoot tr');
  if (!foot.length) return;
  var cells = $$('td', foot[0]);
  s.playerIds.forEach(function (pid, i) {
    if (!cells[i + 1]) return;
    cells[i + 1].textContent = t[pid];
    cells[i + 1].className = (leader && pid === leader.id) ? 'lead' : '';
  });
  refreshPodium(s);
}

/* Enter walks the sheet the way a paper scoresheet does — along the row. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var cell = e.target.closest && e.target.closest('.cell');
  if (cell) {
    var cells = $$('.cell');
    var at = cells.indexOf(cell);
    if (at > -1 && cells[at + 1]) { e.preventDefault(); cells[at + 1].focus(); cells[at + 1].select(); }
    return;
  }
  if (e.target.id === 'bidamt') {
    var sv = $('#savehand');
    if (sv) { e.preventDefault(); sv.focus(); }
  }
});

window.addEventListener('hashchange', render);
applyTheme();
render();
setTimeout(function () { document.body.classList.add('settled'); }, 1300);

/* If a Firestore project is configured, promote the store once the
   connection actually proves out. The board is usable on localStorage the
   whole time; a failed connection leaves it exactly where it was rather
   than blocking the screen on a network round trip. */
if (firebaseConfig()) {
  FirestoreStore.init(function (remote) {
    if (remote) {
      state = remote;
      if (!state.settings) state.settings = { theme: 'terminal' };
      if (!state.players) state.players = [];
      if (!state.sessions) state.sessions = [];
      applyTheme();
      render();
    } else if (Store === FirestoreStore) {
      FirestoreStore.write(state);   /* first device up seeds the document */
    }
  }).then(function () {
    Store = FirestoreStore;
    fb.status = 'on';
  }).catch(function (err) {
    fb.status = 'error';
    fb.detail = (err && (err.code || err.message)) ? String(err.code || err.message) : String(err);
  });
}
</script>
</body>
</html>
